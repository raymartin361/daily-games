<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Hopper — Day 53</title>
<meta name="description" content="Neon Hopper — 60 seconds of neon crossing chaos. Hop your frog across traffic and the river to the lily pads — pads pay 100 x combo, chain 4 to raise it to x5, golden pads pay 5x. How many pads can you fill?">
<script data-goatcounter="https://raymartin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
html,body{overflow:hidden;position:fixed;width:100%;overscroll-behavior:none}
html,body{height:100%;margin:0;padding:0;background:#070512;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'Segoe UI',system-ui,sans-serif}
#c{position:fixed;inset:0;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* Neon Hopper — Day 53. A neon Frogger-style crossing game: hop your frog
   one cell at a time across 5 lanes of traffic and 5 lanes of river to
   reach the lily pads. A pad pays 100 x combo; chain 4 consecutive pad
   reaches to raise the combo x1->x5. Every 6th pad is GOLDEN (5x). Fill
   all 5 pads for a +500 PAD PARTY. Cars, drowning, and being carried off
   by a log each cost a heart (3 hearts). Stars on the safe banks pay
   50 x combo. Flawless (no deaths) +500. */
if (typeof document !== "undefined") {
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
}

//LOGIC-START
var HopperLogic = (function () {
  var W = 480, H = 800;
  var COLS = 12, CELL_W = 40, ROWS = 13, CELL_H = 56, GRID_Y = 64;
  var PAD_COLS = [1, 3, 5, 7, 9];
  var START_COL = 5, START_ROW = 12;
  var MAX_HEARTS = 3, GAME_TIME = 60;
  var ROAD_BASE = 85, ROAD_RAMP = 1.6, ROAD_CAP = 180;
  var RIVER_BASE = 50, RIVER_RAMP = 1.0, RIVER_CAP = 95;
  var FROG_HALF = 13;
  function comboForStreak(streak) {
    var c = 1 + Math.floor(streak / 4);
    return c > 5 ? 5 : c;
  }
  function padPoints(combo, gold) { return 100 * combo * (gold ? 5 : 1); }
  function starPoints(combo) { return 50 * combo; }
  function nextPadGold(padSeq) { return padSeq % 6 === 5; }
  function roadSpeedAt(elapsed, mul) {
    var s = ROAD_BASE * mul + ROAD_RAMP * elapsed;
    return s > ROAD_CAP ? ROAD_CAP : s;
  }
  function riverSpeedAt(elapsed, mul) {
    var s = RIVER_BASE * mul + RIVER_RAMP * elapsed;
    return s > RIVER_CAP ? RIVER_CAP : s;
  }
  // Row 0 = lily pads, 1-5 = river, 6 = safe bank, 7-11 = road, 12 = start.
  function laneKind(row) {
    if (row === 0) return "pad";
    if (row >= 1 && row <= 5) return "river";
    if (row === 6 || row === 12) return "safe";
    return "road";
  }
  // Lanes alternate direction: odd rows go right, even rows go left.
  function laneDir(row) { return row % 2 === 1 ? 1 : -1; }
  function laneMul(row) {
    var muls = [1.0, 0.9, 1.15, 1.0, 1.2, 0.85, 1.0, 1.1, 0.9, 1.2, 1.0, 0.85, 1.0];
    return muls[row];
  }
  function rowY(row) { return GRID_Y + row * CELL_H + CELL_H / 2; }
  function colX(col) { return col * CELL_W + CELL_W / 2; }
  function colFromX(fx) {
    var c = Math.round((fx - CELL_W / 2) / CELL_W);
    if (c < 0) return 0;
    if (c > COLS - 1) return COLS - 1;
    return c;
  }
  // Hop one cell in dir ("up"/"down"/"left"/"right"). Hops that would
  // leave the grid are refused: the frog stays put.
  function hopTarget(col, row, dir) {
    var nc = col, nr = row;
    if (dir === "up") nr--;
    else if (dir === "down") nr++;
    else if (dir === "left") nc--;
    else if (dir === "right") nc++;
    if (nc < 0 || nc > COLS - 1 || nr < 0 || nr > ROWS - 1) return null;
    return { col: nc, row: nr };
  }
  function isPadCol(col) { return PAD_COLS.indexOf(col) !== -1; }
  function padIndex(col) { return PAD_COLS.indexOf(col); }
  function spansOverlap(a0, a1, b0, b1) { return a0 < b1 && b0 < a1; }
  // Does any entity (with wrap copies) cover the frog's span at time dt?
  // Entities: [{x, len, vx}] with x = left edge in world px.
  function coversAt(entities, fx, halfW, dt) {
    for (var i = 0; i < entities.length; i++) {
      var e = entities[i];
      var x0 = e.x + e.vx * dt, x1 = x0 + e.len;
      if (spansOverlap(fx - halfW, fx + halfW, x0, x1)) return true;
      if (spansOverlap(fx - halfW, fx + halfW, x0 - W, x1 - W)) return true;
      if (spansOverlap(fx - halfW, fx + halfW, x0 + W, x1 + W)) return true;
    }
    return false;
  }
  // The log (if any) under the frog right now; null when over water.
  function logUnder(entities, fx, halfW) {
    for (var i = 0; i < entities.length; i++) {
      var e = entities[i];
      if (spansOverlap(fx - halfW, fx + halfW, e.x, e.x + e.len)) return e;
    }
    return null;
  }
  function frogHitByCar(entities, fx) { return coversAt(entities, fx, FROG_HALF, 0); }
  function frogOnLog(entities, fx) { return logUnder(entities, fx, FROG_HALF) !== null; }
  // Wrap an entity that has fully left the screen back to the other side.
  function wrapX(x, len, dir) {
    if (dir > 0 && x > W) return -len;
    if (dir < 0 && x + len < 0) return W;
    return x;
  }
  // Build one lane's entities: cars/trucks on road, logs on river.
  // Positions are spread across the lane with random gaps.
  function makeLane(row) {
    var kind = laneKind(row);
    var ents = [];
    if (kind === "road") {
      // Two or three vehicles per lane with wide gaps — dense enough to
      // demand timing, sparse enough that a gap opens every couple of
      // seconds.
      var n = 2 + Math.floor(Math.random() * 2);
      var cursor = Math.random() * 120;
      for (var i = 0; i < n; i++) {
        var truck = Math.random() < 0.3;
        var len = truck ? 96 : 56;
        ents.push({ x: cursor, len: len, kind: truck ? "truck" : "car", vx: 0 });
        cursor += len + 120 + Math.random() * 100;
        if (cursor > W + 200) break;
      }
    } else if (kind === "river") {
      var m = 3;
      var c2 = Math.random() * 100;
      for (var j = 0; j < m; j++) {
        var llen = 80 + Math.floor(Math.random() * 3) * 20;
        ents.push({ x: c2, len: llen, kind: "log", vx: 0 });
        c2 += llen + 80 + Math.random() * 80;
        if (c2 > W + 200) break;
      }
    }
    return { kind: kind, dir: laneDir(row), mul: laneMul(row), entities: ents };
  }
  function makeState() {
    return { screen: "title", score: 0, best: 0, timeLeft: GAME_TIME,
      streak: 0, pads: 0, padSeq: 0, stars: 0, deaths: 0,
      hearts: MAX_HEARTS, flawless: false, filled: [false, false, false, false, false] };
  }
  return { W: W, H: H, COLS: COLS, CELL_W: CELL_W, ROWS: ROWS, CELL_H: CELL_H,
    GRID_Y: GRID_Y, PAD_COLS: PAD_COLS, START_COL: START_COL, START_ROW: START_ROW,
    MAX_HEARTS: MAX_HEARTS, GAME_TIME: GAME_TIME,
    ROAD_BASE: ROAD_BASE, ROAD_RAMP: ROAD_RAMP, ROAD_CAP: ROAD_CAP,
    RIVER_BASE: RIVER_BASE, RIVER_RAMP: RIVER_RAMP, RIVER_CAP: RIVER_CAP,
    FROG_HALF: FROG_HALF,
    comboForStreak: comboForStreak, padPoints: padPoints, starPoints: starPoints,
    nextPadGold: nextPadGold, roadSpeedAt: roadSpeedAt, riverSpeedAt: riverSpeedAt,
    laneKind: laneKind, laneDir: laneDir, laneMul: laneMul,
    rowY: rowY, colX: colX, colFromX: colFromX, hopTarget: hopTarget,
    isPadCol: isPadCol, padIndex: padIndex, spansOverlap: spansOverlap,
    coversAt: coversAt, logUnder: logUnder, frogHitByCar: frogHitByCar,
    frogOnLog: frogOnLog, wrapX: wrapX, makeLane: makeLane, makeState: makeState };
})();
//LOGIC-END

(function () {
  var L = HopperLogic;
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var vw = 0, vh = 0, dpr = 1, scale = 1, ox = 0, oy = 0;
  function resize() {
    vw = window.innerWidth; vh = window.innerHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = vw * dpr; canvas.height = vh * dpr;
    canvas.style.width = vw + "px"; canvas.style.height = vh + "px";
    scale = Math.min(vw / L.W, vh / L.H);
    ox = (vw - L.W * scale) / 2; oy = (vh - L.H * scale) / 2;
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);
  resize();

  var AC = null, muted = false;
  try { muted = localStorage.getItem("neon_hopper_mute") === "1"; } catch (e) {}
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === "suspended") AC.resume();
    return AC;
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (muted) return;
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.15, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }
  function buzz(p) { try { if (navigator.vibrate && !muted) navigator.vibrate(p); } catch (e) {} }

  var S = L.makeState();
  try { S.best = parseInt(localStorage.getItem("neon_hopper_best") || "0", 10) || 0; } catch (e) {}
  var elapsed = 0;
  var lanes = []; // index by row; only road/river rows have entities
  var frog = { fx: L.colX(L.START_COL), row: L.START_ROW, fromX: 0, fromY: 0, hopT: 1 };
  var stars = []; // {col, row, t}
  var starTimer = 2;
  var particles = [], floats = [], bgDots = [];
  var hopCooldown = 0, autoCooldown = 0;
  var auto = (location.search.indexOf("auto=1") !== -1);
  for (var i = 0; i < 70; i++) {
    bgDots.push({ x: Math.random() * L.W, y: Math.random() * L.H, s: 0.6 + Math.random() * 1.6, tw: Math.random() * Math.PI * 2 });
  }

  function buildLanes() {
    lanes = [];
    for (var r = 0; r < L.ROWS; r++) lanes.push(L.makeLane(r));
  }
  function frogCol() { return L.colFromX(frog.fx); }
  function resetFrog() {
    frog.fx = L.colX(L.START_COL); frog.row = L.START_ROW;
    frog.fromX = frog.fx; frog.fromY = L.rowY(L.START_ROW); frog.hopT = 1;
  }
  function reset() {
    S = L.makeState();
    try { S.best = parseInt(localStorage.getItem("neon_hopper_best") || "0", 10) || 0; } catch (e) {}
    elapsed = 0; stars = []; starTimer = 2;
    particles = []; floats = []; hopCooldown = 0; autoCooldown = 0;
    buildLanes();
    resetFrog();
    window.__hopperState = S;
  }
  function start() { reset(); S.screen = "playing"; tone(660, 0.12, "sine", 0.2, 990); }
  function endGame(outOfHearts) {
    if (S.screen !== "playing") return;
    S.screen = "over";
    if (S.deaths === 0 && S.pads > 0) { S.flawless = true; S.score += 500; }
    if (S.score > S.best) { S.best = S.score; try { localStorage.setItem("neon_hopper_best", String(S.best)); } catch (e) {} }
    tone(220, 0.4, "sawtooth", 0.15, 110);
    tone(880, 0.3, "sine", 0.12, 660);
    window.__hopperState = S;
  }
  function addFloat(x, y, text, golden) {
    floats.push({ x: x, y: y, text: text, t: 0, golden: !!golden });
  }
  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 180;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, color: color });
    }
  }
  function die(cause) {
    S.hearts--; S.deaths++; S.streak = 0;
    addFloat(frog.fx, L.rowY(frog.row) - 30, cause === "car" ? "SPLAT!" : "SPLASH!", false);
    burst(frog.fx, L.rowY(frog.row), cause === "car" ? "#ff5e7a" : "#6cf0ff", 20);
    tone(140, 0.3, "sawtooth", 0.2, 70);
    buzz(90);
    window.__hopperLastEvent = { type: "death", cause: cause, hearts: S.hearts, deaths: S.deaths };
    window.__hopperState = S;
    if (S.hearts <= 0) { endGame(true); return; }
    resetFrog();
  }
  function onPad() {
    var col = frogCol();
    var pi = L.padIndex(col);
    var gold = L.nextPadGold(S.padSeq);
    var combo = L.comboForStreak(S.streak);
    var pts = L.padPoints(combo, gold);
    S.score += pts; S.pads++; S.padSeq++; S.streak++;
    S.filled[pi] = true;
    addFloat(frog.fx, L.rowY(0) - 24, "+" + pts + (gold ? " GOLDEN!" : ""), gold);
    burst(frog.fx, L.rowY(0), gold ? "#ffd75e" : "#2ee6a8", 16);
    tone(gold ? 1046 : 523, 0.1, "triangle", 0.2);
    tone(784, 0.14, "triangle", 0.18);
    buzz(25);
    window.__hopperLastEvent = { type: "pad", pts: pts, pads: S.pads, streak: S.streak, gold: gold };
    window.__hopperState = S;
    if (S.pads >= 5) {
      S.score += 500;
      addFloat(240, 200, "PAD PARTY +500!", true);
      tone(1175, 0.2, "triangle", 0.2);
      S.filled = [false, false, false, false, false];
      S.pads = 0;
    }
    resetFrog();
  }
  function onStar() {
    var combo = L.comboForStreak(S.streak);
    var pts = L.starPoints(combo);
    S.score += pts; S.stars++;
    addFloat(frog.fx, L.rowY(frog.row) - 24, "+" + pts, false);
    burst(frog.fx, L.rowY(frog.row), "#ffd75e", 8);
    tone(880, 0.08, "sine", 0.16);
    window.__hopperLastEvent = { type: "star", pts: pts, stars: S.stars };
    window.__hopperState = S;
  }
  function tryHop(dir) {
    if (S.screen !== "playing" || hopCooldown > 0) return false;
    var t = L.hopTarget(frogCol(), frog.row, dir);
    if (!t) return false;
    // Occupied pads refuse the hop — the frog stays put.
    if (t.row === 0 && L.isPadCol(t.col) && S.filled[L.padIndex(t.col)]) return false;
    frog.fromX = frog.fx; frog.fromY = L.rowY(frog.row);
    frog.fx = L.colX(t.col); frog.row = t.row;
    frog.hopT = 0; hopCooldown = 0.12;
    tone(440, 0.05, "square", 0.08, 560);
    return true;
  }
  function laneEntities(row) { return lanes[row].entities; }
  function laneSpeed(row) {
    var lane = lanes[row];
    if (lane.kind === "road") return L.roadSpeedAt(elapsed, lane.mul) * lane.dir;
    if (lane.kind === "river") return L.riverSpeedAt(elapsed, lane.mul) * lane.dir;
    return 0;
  }
  // Is hopping to (col,row) safe right now and 0.35s from now?
  function safeToHop(col, row) {
    var kind = L.laneKind(row);
    var tx = L.colX(col);
    if (kind === "road") {
      var ents = laneEntities(row);
      // Look 0.45s ahead: the frog must survive the wait before its next hop too.
      return !L.coversAt(ents, tx, L.FROG_HALF + 6, 0) && !L.coversAt(ents, tx, L.FROG_HALF + 6, 0.45);
    }
    if (kind === "river") {
      var log = L.logUnder(laneEntities(row), tx, L.FROG_HALF + 4);
      if (!log) return false;
      // The log must not carry the frog off-screen within 1.5s.
      var fx2 = tx + log.vx * 1.5;
      return fx2 > 24 && fx2 < L.W - 24;
    }
    if (kind === "pad") {
      return L.isPadCol(col) && !S.filled[L.padIndex(col)];
    }
    return true;
  }
  function nearestFreePadCol() {
    var best = -1, bestD = 99;
    for (var i = 0; i < L.PAD_COLS.length; i++) {
      if (S.filled[i]) continue;
      var d = Math.abs(L.PAD_COLS[i] - frogCol());
      if (d < bestD) { bestD = d; best = L.PAD_COLS[i]; }
    }
    return best === -1 ? L.START_COL : best;
  }
  // Is the frog's CURRENT cell safe for the next 0.45s? Uses the frog's
  // actual pixel position (it drifts while riding a log).
  function currentCellSafe() {
    var row = frog.row;
    var kind = L.laneKind(row);
    if (kind === "road") {
      var ents = laneEntities(row);
      return !L.coversAt(ents, frog.fx, L.FROG_HALF + 6, 0) &&
        !L.coversAt(ents, frog.fx, L.FROG_HALF + 6, 0.45);
    }
    if (kind === "river") {
      var log = L.logUnder(laneEntities(row), frog.fx, L.FROG_HALF + 4);
      if (!log) return false;
      var fx2 = frog.fx + log.vx * 1.5;
      return fx2 > 24 && fx2 < L.W - 24;
    }
    return true;
  }
  function autoPilot(dt) {
    autoCooldown -= dt;
    if (autoCooldown > 0) return;
    autoCooldown = 0.15;
    var col = frogCol(), row = frog.row;
    var kind = L.laneKind(row);
    var target = nearestFreePadCol();
    // 1. Escape a log that's about to carry the frog off-screen.
    if (kind === "river") {
      var log = L.logUnder(laneEntities(row), frog.fx, L.FROG_HALF);
      if (log) {
        var edge = log.vx > 0 ? L.W - 30 : 30;
        if ((log.vx > 0 && frog.fx > edge - 40) || (log.vx < 0 && frog.fx < edge + 40)) {
          if (safeToHop(col, row - 1)) { tryHop("up"); return; }
          if (col < L.COLS - 1 && safeToHop(col + 1, row)) { tryHop("right"); return; }
          if (col > 0 && safeToHop(col - 1, row)) { tryHop("left"); return; }
          if (row < L.ROWS - 1 && safeToHop(col, row + 1)) { tryHop("down"); return; }
        }
      }
    }
    // 2. Hop up whenever it's safe — get off dangerous rows fast.
    if (row > 0 && safeToHop(col, row - 1)) { tryHop("up"); return; }
    // 3. On a dangerous row with the way up blocked: if this cell is
    //    about to become unsafe, escape sideways (or retreat down to a
    //    safe bank). If this cell is safe, WAIT here — never sidestep
    //    along a live lane toward the pads; that's how frogs die.
    if (kind === "road" || kind === "river") {
      if (!currentCellSafe()) {
        if (col > 0 && safeToHop(col - 1, row)) { tryHop("left"); return; }
        if (col < L.COLS - 1 && safeToHop(col + 1, row)) { tryHop("right"); return; }
        if (row < L.ROWS - 1 && L.laneKind(row + 1) === "safe" && safeToHop(col, row + 1)) { tryHop("down"); return; }
      }
      return;
    }
    // 4. On a safe row: sidestep toward the nearest free pad column.
    if (col < target && safeToHop(col + 1, row)) { tryHop("right"); return; }
    if (col > target && safeToHop(col - 1, row)) { tryHop("left"); return; }
  }

  function toWorld(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    var cx = (clientX - r.left) / (r.width / vw);
    var cy = (clientY - r.top) / (r.height / vh);
    return { x: (cx - ox) / scale, y: (cy - oy) / scale };
  }
  var downPos = null, downTime = 0;
  function onDown(e) {
    if (S.screen === "title" || S.screen === "over") { start(); return; }
    downPos = { x: e.clientX, y: e.clientY }; downTime = performance.now();
    e.preventDefault();
  }
  function onUp(e) {
    if (!downPos) return;
    var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    var dist = Math.hypot(dx, dy);
    var w = toWorld(e.clientX, e.clientY);
    var f = { x: frog.fx, y: L.rowY(frog.row) };
    if (dist >= 24) {
      // Swipe: hop in the swipe direction.
      if (Math.abs(dx) > Math.abs(dy)) tryHop(dx > 0 ? "right" : "left");
      else tryHop(dy > 0 ? "down" : "up");
    } else if (performance.now() - downTime < 400) {
      // Tap: hop one cell toward the tap point.
      var tx = w.x - f.x, ty = w.y - f.y;
      if (Math.abs(tx) > Math.abs(ty)) tryHop(tx > 0 ? "right" : "left");
      else if (Math.abs(ty) > 8) tryHop(ty > 0 ? "down" : "up");
    }
    downPos = null;
    e.preventDefault();
  }
  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", function () { downPos = null; });
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") tryHop("up");
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") tryHop("down");
    else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") tryHop("left");
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") tryHop("right");
    else if (e.key === "Enter" && (S.screen === "title" || S.screen === "over")) start();
    else if (e.key === "m" || e.key === "M") { muted = !muted; try { localStorage.setItem("neon_hopper_mute", muted ? "1" : "0"); } catch (err) {} }
  });

  function update(dt) {
    if (S.screen !== "playing") return;
    elapsed += dt;
    S.timeLeft = Math.max(0, L.GAME_TIME - elapsed);
    if (S.timeLeft <= 0) { endGame(false); return; }
    hopCooldown = Math.max(0, hopCooldown - dt);
    if (frog.hopT < 1) frog.hopT = Math.min(1, frog.hopT + dt / 0.12);
    if (auto) autoPilot(dt);

    // Move lane entities.
    for (var r = 0; r < L.ROWS; r++) {
      var lane = lanes[r];
      if (lane.kind !== "road" && lane.kind !== "river") continue;
      var v = laneSpeed(r);
      for (var i = 0; i < lane.entities.length; i++) {
        var e = lane.entities[i];
        e.vx = v;
        e.x += v * dt;
        e.x = L.wrapX(e.x, e.len, lane.dir);
      }
    }

    var kind = L.laneKind(frog.row);
    // Ride logs: the frog moves with the log under it.
    if (kind === "river") {
      var log = L.logUnder(laneEntities(frog.row), frog.fx, L.FROG_HALF);
      if (!log) { die("drown"); return; }
      frog.fx += log.vx * dt;
      frog.fromX = frog.fx;
      if (frog.fx < 8 || frog.fx > L.W - 8) { die("drown"); return; }
    } else if (kind === "road") {
      if (L.frogHitByCar(laneEntities(frog.row), frog.fx)) { die("car"); return; }
    } else if (kind === "pad") {
      var col = frogCol();
      if (!L.isPadCol(col)) { die("drown"); return; }
      onPad();
      return;
    }
    // Star pickup.
    for (var s = stars.length - 1; s >= 0; s--) {
      var st = stars[s];
      st.t += dt;
      if (st.t > 6) { stars.splice(s, 1); continue; }
      if (st.row === frog.row && Math.abs(L.colX(st.col) - frog.fx) < 20) {
        stars.splice(s, 1);
        onStar();
      }
    }
    // Spawn stars on the safe banks.
    starTimer -= dt;
    if (starTimer <= 0) {
      starTimer = 3;
      if (stars.length < 2) {
        stars.push({ col: Math.floor(Math.random() * L.COLS), row: Math.random() < 0.5 ? 6 : 12, t: 0 });
      }
    }
    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.x += p.vx * dt; p.y += p.vy * dt; p.t += dt;
      if (p.t > 0.6) particles.splice(j, 1);
    }
    for (var k = floats.length - 1; k >= 0; k--) {
      floats[k].y -= 40 * dt; floats[k].t += dt;
      if (floats[k].t > 0.9) floats.splice(k, 1);
    }
    for (var b = 0; b < bgDots.length; b++) bgDots[b].tw += dt * 2;
  }

  function drawFrog(x, y, hopArc) {
    var gold = L.nextPadGold(S.padSeq);
    ctx.save();
    ctx.translate(x, y - hopArc);
    ctx.fillStyle = "#2ee6a8";
    ctx.strokeStyle = gold ? "#ffd75e" : "#7dffce"; ctx.lineWidth = 2;
    ctx.shadowColor = gold ? "#ffd75e" : "#2ee6a8"; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    // Eyes.
    ctx.fillStyle = "#e8ecff";
    ctx.beginPath(); ctx.arc(-6, -11, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -11, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0b1026";
    ctx.beginPath(); ctx.arc(-6, -11, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -11, 2, 0, Math.PI * 2); ctx.fill();
    // Smile.
    ctx.strokeStyle = "#0b1026"; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 2, 6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.restore();
  }
  function drawHUD() {
    ctx.fillStyle = "rgba(7,5,18,0.88)";
    ctx.fillRect(0, 0, L.W, 54);
    ctx.fillStyle = "#e8ecff"; ctx.font = "bold 20px 'Segoe UI',system-ui,sans-serif";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText("SCORE " + S.score, 14, 18);
    ctx.fillText("BEST " + S.best, 14, 42);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd75e";
    ctx.fillText("TIME " + Math.ceil(S.timeLeft) + "s", 240, 18);
    var combo = L.comboForStreak(S.streak);
    ctx.fillStyle = combo >= 3 ? "#ff8cd1" : "#aab4e8";
    ctx.fillText("COMBO x" + combo + (S.streak > 0 ? " (" + S.streak + ")" : ""), 240, 42);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ff5e7a";
    var hearts = "";
    for (var i = 0; i < L.MAX_HEARTS; i++) hearts += i < S.hearts ? "♥" : "♡";
    ctx.fillText(hearts, 466, 18);
    ctx.fillStyle = "#2ee6a8";
    var pads = "";
    for (var j = 0; j < 5; j++) pads += S.filled[j] ? "●" : "○";
    ctx.fillText("PADS " + pads, 466, 42);
  }
  function drawTitle() {
    ctx.fillStyle = "#e8ecff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "bold 52px 'Segoe UI',system-ui,sans-serif";
    ctx.shadowColor = "#2ee6a8"; ctx.shadowBlur = 18;
    ctx.fillText("NEON", 240, 180);
    ctx.fillText("HOPPER", 240, 240);
    ctx.shadowBlur = 0;
    ctx.font = "16px 'Segoe UI',system-ui,sans-serif";
    ctx.fillStyle = "#aab4e8";
    ctx.fillText("60 seconds of neon crossing chaos!", 240, 298);
    ctx.fillText("TAP or SWIPE to hop — cross the traffic,", 240, 326);
    ctx.fillText("ride the logs, reach the lily pads.", 240, 354);
    ctx.fillText("Pads pay 100 x combo — chain 4 to raise it to x5.", 240, 382);
    ctx.fillText("Golden pads pay 5x. Fill all 5 for +500!", 240, 410);
    ctx.fillStyle = "#ffd75e"; ctx.font = "bold 20px 'Segoe UI',system-ui,sans-serif";
    ctx.fillText(S.best > 0 ? "BEST " + S.best + " — TAP TO PLAY" : "TAP TO PLAY", 240, 468);
    ctx.fillStyle = "#7780b8"; ctx.font = "14px 'Segoe UI',system-ui,sans-serif";
    ctx.fillText("Arrows / WASD hop · M mute · Day 53", 240, 508);
    drawFrog(240, 600, 0);
  }
  function drawOver() {
    ctx.fillStyle = "rgba(7,5,18,0.72)";
    ctx.fillRect(0, 0, L.W, L.H);
    ctx.fillStyle = "#e8ecff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "bold 44px 'Segoe UI',system-ui,sans-serif";
    ctx.shadowColor = "#ff8cd1"; ctx.shadowBlur = 16;
    ctx.fillText(S.hearts <= 0 ? "HOPPED OUT!" : "TIME'S UP!", 240, 260);
    ctx.shadowBlur = 0;
    ctx.font = "bold 30px 'Segoe UI',system-ui,sans-serif";
    ctx.fillStyle = "#ffd75e";
    ctx.fillText("SCORE " + S.score, 240, 330);
    ctx.font = "20px 'Segoe UI',system-ui,sans-serif";
    ctx.fillStyle = "#aab4e8";
    ctx.fillText("Pads " + S.pads + " · Stars " + S.stars + " · Deaths " + S.deaths, 240, 372);
    if (S.flawless) { ctx.fillStyle = "#2ee6a8"; ctx.fillText("FLAWLESS +500 — not a single splash!", 240, 404); }
    ctx.fillStyle = "#e8ecff";
    ctx.fillText("BEST " + S.best, 240, 436);
    ctx.fillStyle = "#ffd75e"; ctx.font = "bold 20px 'Segoe UI',system-ui,sans-serif";
    ctx.fillText("TAP TO PLAY AGAIN", 240, 500);
  }
  function render() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
    var bg = ctx.createLinearGradient(0, 0, 0, L.H);
    bg.addColorStop(0, "#04122b");
    bg.addColorStop(0.5, "#0b1030");
    bg.addColorStop(1, "#0a2410");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, L.W, L.H);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, L.W, L.H); ctx.clip();
    for (var i = 0; i < bgDots.length; i++) {
      var bd = bgDots[i];
      ctx.globalAlpha = 0.3 + 0.4 * Math.abs(Math.sin(bd.tw));
      ctx.fillStyle = "#cdd6ff";
      ctx.beginPath(); ctx.arc(bd.x, bd.y, bd.s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Lane bands.
    for (var r = 0; r < L.ROWS; r++) {
      var y0 = L.GRID_Y + r * L.CELL_H;
      var kind = L.laneKind(r);
      if (kind === "river" || kind === "pad") {
        var wv = ctx.createLinearGradient(0, y0, 0, y0 + L.CELL_H);
        wv.addColorStop(0, "#0a2a5e");
        wv.addColorStop(1, "#0d3f7a");
        ctx.fillStyle = wv;
        ctx.fillRect(0, y0, L.W, L.CELL_H);
        // Animated wave dashes.
        ctx.strokeStyle = "rgba(108,240,255,0.25)"; ctx.lineWidth = 2;
        var off = (performance.now() / 40 + r * 37) % 40;
        for (var wx = -40 + off; wx < L.W; wx += 40) {
          ctx.beginPath(); ctx.moveTo(wx, y0 + 14); ctx.lineTo(wx + 16, y0 + 14); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(wx + 8, y0 + L.CELL_H - 14); ctx.lineTo(wx + 24, y0 + L.CELL_H - 14); ctx.stroke();
        }
      } else if (kind === "road") {
        ctx.fillStyle = "#14141f";
        ctx.fillRect(0, y0, L.W, L.CELL_H);
        ctx.strokeStyle = "rgba(232,236,255,0.28)"; ctx.lineWidth = 2;
        ctx.setLineDash([16, 16]);
        ctx.beginPath(); ctx.moveTo(0, y0 + L.CELL_H / 2); ctx.lineTo(L.W, y0 + L.CELL_H / 2); ctx.stroke();
        ctx.setLineDash([]);
      } else {
        ctx.fillStyle = r === 12 ? "#0a2410" : "#0d2b12";
        ctx.fillRect(0, y0, L.W, L.CELL_H);
        ctx.fillStyle = "rgba(46,230,168,0.12)";
        for (var gx = 20; gx < L.W; gx += 40) {
          ctx.beginPath(); ctx.arc(gx, y0 + L.CELL_H / 2, 2, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    // Lily pads (row 0).
    for (var pi = 0; pi < L.PAD_COLS.length; pi++) {
      var pc = L.PAD_COLS[pi];
      var px = L.colX(pc), py = L.rowY(0);
      var filled = S.filled[pi];
      var gold = L.nextPadGold(S.padSeq) && !filled;
      ctx.fillStyle = filled ? "#2ee6a8" : (gold ? "#ffd75e" : "#1f9d5c");
      ctx.strokeStyle = filled ? "#7dffce" : (gold ? "#ffe9a8" : "#2ee6a8"); ctx.lineWidth = 2;
      ctx.shadowColor = filled ? "#2ee6a8" : (gold ? "#ffd75e" : "#1f9d5c"); ctx.shadowBlur = filled || gold ? 14 : 4;
      ctx.beginPath(); ctx.arc(px, py, 19, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      // Notch.
      ctx.fillStyle = "#0d3f7a";
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 19, py - 8); ctx.lineTo(px + 19, py + 8); ctx.closePath(); ctx.fill();
      if (filled) drawFrog(px, py, 0);
    }
    // Logs.
    for (var lr = 1; lr <= 5; lr++) {
      var lane = lanes[lr];
      for (var li = 0; li < lane.entities.length; li++) {
        var lg = lane.entities[li];
        var ly = L.rowY(lr);
        ctx.fillStyle = "#7a4a21";
        ctx.strokeStyle = "#c98a4b"; ctx.lineWidth = 2;
        ctx.shadowColor = "#c98a4b"; ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.roundRect(lg.x, ly - 14, lg.len, 28, 14);
        ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(201,138,75,0.7)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(lg.x + 12, ly, 7, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(lg.x + lg.len - 12, ly, 7, 0, Math.PI * 2); ctx.stroke();
      }
    }
    // Cars and trucks.
    for (var cr = 7; cr <= 11; cr++) {
      var clane = lanes[cr];
      for (var ci = 0; ci < clane.entities.length; ci++) {
        var car = clane.entities[ci];
        var cy = L.rowY(cr);
        var isTruck = car.kind === "truck";
        ctx.fillStyle = isTruck ? "#3a2a4d" : "#2a1a3d";
        ctx.strokeStyle = isTruck ? "#ff9d5c" : "#ff5e7a"; ctx.lineWidth = 2;
        ctx.shadowColor = isTruck ? "#ff9d5c" : "#ff5e7a"; ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(car.x, cy - 15, car.len, 30, 8);
        ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        // Windshield + headlights.
        ctx.fillStyle = "rgba(108,240,255,0.5)";
        ctx.fillRect(car.x + 8, cy - 10, car.len - 16, 8);
        ctx.fillStyle = "#ffd75e";
        var hx = clane.dir > 0 ? car.x + car.len - 4 : car.x;
        ctx.beginPath(); ctx.arc(hx, cy - 8, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(hx, cy + 8, 3, 0, Math.PI * 2); ctx.fill();
      }
    }
    // Stars.
    for (var si = 0; si < stars.length; si++) {
      var st = stars[si];
      var sx = L.colX(st.col), sy = L.rowY(st.row);
      var pulse = 0.7 + 0.3 * Math.sin(performance.now() / 150);
      ctx.fillStyle = "#ffd75e";
      ctx.shadowColor = "#ffd75e"; ctx.shadowBlur = 12;
      ctx.globalAlpha = pulse;
      ctx.beginPath();
      ctx.moveTo(sx, sy - 12); ctx.lineTo(sx + 4, sy - 4); ctx.lineTo(sx + 12, sy);
      ctx.lineTo(sx + 4, sy + 4); ctx.lineTo(sx, sy + 12); ctx.lineTo(sx - 4, sy + 4);
      ctx.lineTo(sx - 12, sy); ctx.lineTo(sx - 4, sy - 4); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    }
    // Frog (with hop arc) — only during play; the title screen has its own demo frog.
    if (S.screen === "playing") {
      var t = frog.hopT;
      var rx = frog.fromX + (frog.fx - frog.fromX) * t;
      var ry = frog.fromY + (L.rowY(frog.row) - frog.fromY) * t;
      var arc = t < 1 ? Math.sin(t * Math.PI) * 10 : 0;
      if (S.screen === "playing") drawFrog(rx, ry, arc);
    }
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      ctx.globalAlpha = Math.max(0, 1 - p.t / 0.6);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (var k = 0; k < floats.length; k++) {
      var f = floats[k];
      ctx.globalAlpha = Math.max(0, 1 - f.t / 0.9);
      ctx.fillStyle = f.golden ? "#ffd75e" : "#e8ecff";
      ctx.font = "bold 22px 'Segoe UI',system-ui,sans-serif";
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (S.screen === "title") drawTitle();
    else if (S.screen === "over") drawOver();
    if (S.screen === "playing" || S.screen === "over") drawHUD();
  }

  window.__hopperState = S;
  window.__hopperDebug = {
    frog: function () { return { fx: frog.fx, col: frogCol(), row: frog.row, hopT: frog.hopT }; },
    lanes: function () { return lanes.map(function (l, i) { return { row: i, kind: l.kind, dir: l.dir, ents: l.entities.map(function (e) { return { x: Math.round(e.x), len: e.len, vx: Math.round(e.vx) }; }) }; }); },
    setAuto: function (v) { auto = v; },
    start: function () { start(); },
    hop: function (dir) { return tryHop(dir); },
    // Teleport the frog to row 1 above the first free pad, then hop up:
    // the next physics step must resolve it as a pad reach.
    debugPad: function () {
      if (S.screen !== "playing") return null;
      var pi = -1;
      for (var i = 0; i < 5; i++) { if (!S.filled[i]) { pi = i; break; } }
      if (pi === -1) return null;
      frog.fx = L.colX(L.PAD_COLS[pi]); frog.row = 1;
      frog.fromX = frog.fx; frog.fromY = L.rowY(1); frog.hopT = 1;
      hopCooldown = 0;
      tryHop("up");
      return { padCol: L.PAD_COLS[pi] };
    },
    // Teleport the frog into a road lane under a car: next step must kill it.
    debugCrash: function () {
      if (S.screen !== "playing") return null;
      for (var r = 7; r <= 11; r++) {
        var ents = laneEntities(r);
        if (ents.length) {
          frog.fx = ents[0].x + ents[0].len / 2; frog.row = r;
          frog.fromX = frog.fx; frog.fromY = L.rowY(r); frog.hopT = 1;
          return { row: r };
        }
      }
      return null;
    },
    // Teleport the frog into open river water: scan for a spot no log
    // covers (with margin for one frame of log drift), so the next
    // physics step must drown it.
    debugDrown: function () {
      if (S.screen !== "playing") return null;
      for (var r = 1; r <= 5; r++) {
        for (var x = 30; x < L.W; x += 20) {
          if (!L.logUnder(laneEntities(r), x, L.FROG_HALF + 4)) {
            frog.fx = x; frog.row = r;
            frog.fromX = frog.fx; frog.fromY = L.rowY(r); frog.hopT = 1;
            return { row: r, x: x };
          }
        }
      }
      return null;
    }
  };

  buildLanes();
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (auto) start();
})();
</script>
</body>
</html>
