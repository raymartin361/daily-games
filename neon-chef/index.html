<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Chef — Day 59</title>
<meta name="description" content="Neon Chef — 60 seconds of neon cooking chaos. Tap ingredients to build each order, then SERVE before patience runs out. Correct serves pay 100 x combo, golden orders pay 5x.">
<script data-goatcounter="https://raymartin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
html,body{overflow:hidden;position:fixed;width:100%;overscroll-behavior:none}
html,body{height:100%;margin:0;padding:0;background:#070512;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'Segoe UI',system-ui,sans-serif}
#c{position:fixed;inset:0;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* Neon Chef — Day 59. You run a neon kitchen for 60 seconds.
   Customers queue up with orders (BURGER / PIZZA / TACO / WRAP), each
   needing 3 ingredients. Tap an order card to select it, tap ingredient
   buttons to build the dish on your plate, tap SERVE when the plate
   matches. A correct serve pays 100 x combo; chain 4 correct serves
   to raise the combo x1->x5. Every 6th order is GOLDEN (5x). A wrong
   serve or an order whose patience runs out costs a heart (3 hearts).
   Tip stars pop up on the counter — tap them for 50 x combo.
   Flawless (no hearts lost) +500. Best score persisted. */
if (typeof document !== "undefined") {
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
}

//LOGIC-START
var ChefLogic = (function () {
  var W = 480, H = 800;
  var GAME_TIME = 60, MAX_HEARTS = 3, MAX_ORDERS = 3, PLATE_CAP = 5;
  var HUD_H = 76;
  var ORDER_Y = 88, ORDER_H = 108, ORDER_W = 146, ORDER_GAP = 9;
  var PLATE = { x: 240, y: 330, r: 92 };
  var SERVE = { x: 110, y: 470, w: 260, h: 60 };
  // Ingredient grid: 4 columns x 2 rows of buttons.
  var ING_W = 105, ING_H = 100, ING_X0 = 12, ING_Y0 = 548, ING_GAP = 12;

  var INGREDIENTS = [
    { id: "bun", name: "BUN", code: "BU", color: "#f2c14e", shape: "dome" },
    { id: "patty", name: "PATTY", code: "PA", color: "#8a5a2b", shape: "rect" },
    { id: "cheese", name: "CHEESE", code: "CH", color: "#ffd94a", shape: "tri" },
    { id: "lettuce", name: "LETTUCE", code: "LE", color: "#7dff5e", shape: "wavy" },
    { id: "base", name: "BASE", code: "BA", color: "#e8c98a", shape: "circle" },
    { id: "pepperoni", name: "PEPPERONI", code: "PE", color: "#ff5e5e", shape: "dots" },
    { id: "shell", name: "SHELL", code: "SH", color: "#ff9d5c", shape: "dome" },
    { id: "salsa", name: "SALSA", code: "SA", color: "#ff3d6e", shape: "bowl" }
  ];
  var RECIPES = [
    { dish: "BURGER", ingredients: ["bun", "patty", "cheese"], color: "#ff9d5c" },
    { dish: "PIZZA", ingredients: ["base", "cheese", "pepperoni"], color: "#ffd94a" },
    { dish: "TACO", ingredients: ["shell", "patty", "salsa"], color: "#ff5e7a" },
    { dish: "WRAP", ingredients: ["shell", "lettuce", "cheese"], color: "#7dff5e" }
  ];

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function makeState() {
    return { screen: "title", score: 0, best: 0, combo: 1, streak: 0,
      served: 0, wrong: 0, expired: 0, hearts: MAX_HEARTS, timeLeft: GAME_TIME,
      flawless: false, stars: 0, spawned: 0 };
  }
  // combo: +1 every 4 consecutive correct serves, capped at x5.
  function comboForStreak(streak) {
    var c = 1 + Math.floor(streak / 4);
    return c > 5 ? 5 : c;
  }
  function servePoints(combo, golden) { return 100 * combo * (golden ? 5 : 1); }
  function starPoints(combo) { return 50 * combo; }
  // 1-based: the 6th, 12th, 18th... order spawned is GOLDEN.
  function isGoldenSpawn(n) { return n % 6 === 0; }
  function makeOrder(n, dishIdx) {
    var r = RECIPES[dishIdx % RECIPES.length];
    return { id: n, dish: r.dish, ingredients: r.ingredients.slice(),
      patience: orderPatience(0), maxPatience: orderPatience(0),
      golden: isGoldenSpawn(n), color: r.color };
  }
  // Multiset equality: same length and same counts per ingredient.
  // Order-independent, so the plate can be built in any order.
  function plateMatches(recipe, plate) {
    if (recipe.length !== plate.length) return false;
    var counts = {};
    for (var i = 0; i < recipe.length; i++) counts[recipe[i]] = (counts[recipe[i]] || 0) + 1;
    for (var j = 0; j < plate.length; j++) {
      if (!counts[plate[j]]) return false;
      counts[plate[j]]--;
    }
    return true;
  }
  // How many of `id` the recipe still needs beyond what's on the plate.
  function missingCount(recipe, plate, id) {
    var need = 0, have = 0;
    for (var i = 0; i < recipe.length; i++) if (recipe[i] === id) need++;
    for (var j = 0; j < plate.length; j++) if (plate[j] === id) have++;
    return need - have;
  }
  function orderInterval(elapsed) {
    var iv = 4.5 - elapsed * 0.02;
    return iv < 2.6 ? 2.6 : iv;
  }
  function orderPatience(elapsed) {
    var p = 14 - elapsed * 0.03;
    return p < 11 ? 11 : p;
  }
  function maxOrders() { return MAX_ORDERS; }
  function orderSlotRect(i) {
    return { x: ING_X0 + i * (ORDER_W + ORDER_GAP), y: ORDER_Y, w: ORDER_W, h: ORDER_H };
  }
  function ingButtonRect(i) {
    var col = i % 4, row = Math.floor(i / 4);
    return { x: ING_X0 + col * (ING_W + ING_GAP), y: ING_Y0 + row * (ING_H + 8), w: ING_W, h: ING_H };
  }
  function serveRect() { return { x: SERVE.x, y: SERVE.y, w: SERVE.w, h: SERVE.h }; }
  function pointInRect(px, py, r) {
    return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  }
  function ingredientById(id) {
    for (var i = 0; i < INGREDIENTS.length; i++) if (INGREDIENTS[i].id === id) return INGREDIENTS[i];
    return null;
  }

  return { W: W, H: H, GAME_TIME: GAME_TIME, MAX_HEARTS: MAX_HEARTS,
    MAX_ORDERS: MAX_ORDERS, PLATE_CAP: PLATE_CAP, HUD_H: HUD_H,
    ORDER_Y: ORDER_Y, ORDER_H: ORDER_H, ORDER_W: ORDER_W,
    PLATE: PLATE, SERVE: SERVE,
    ING_W: ING_W, ING_H: ING_H, ING_X0: ING_X0, ING_Y0: ING_Y0,
    INGREDIENTS: INGREDIENTS, RECIPES: RECIPES,
    clamp: clamp, makeState: makeState,
    comboForStreak: comboForStreak, servePoints: servePoints,
    starPoints: starPoints, isGoldenSpawn: isGoldenSpawn,
    makeOrder: makeOrder, plateMatches: plateMatches,
    missingCount: missingCount, orderInterval: orderInterval,
    orderPatience: orderPatience, maxOrders: maxOrders,
    orderSlotRect: orderSlotRect, ingButtonRect: ingButtonRect,
    serveRect: serveRect, pointInRect: pointInRect,
    ingredientById: ingredientById };
})();
//LOGIC-END

(function () {
  var L = ChefLogic;
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var vw = 0, vh = 0, dpr = 1, scale = 1, ox = 0, oy = 0;
  function resize() {
    vw = window.innerWidth; vh = window.innerHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = vw * dpr; canvas.height = vh * dpr;
    canvas.style.width = vw + "px"; canvas.style.height = vh + "px";
    scale = Math.min(vw / L.W, vh / L.H);
    ox = (vw - L.W * scale) / 2; oy = (vh - L.H * scale) / 2;
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);
  resize();

  var AC = null, muted = false;
  try { muted = localStorage.getItem("neon_chef_mute") === "1"; } catch (e) {}
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === "suspended") AC.resume();
    return AC;
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (muted) return;
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.15, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }
  function buzz(p) { try { if (navigator.vibrate && !muted) navigator.vibrate(p); } catch (e) {} }

  var S = L.makeState();
  try { S.best = parseInt(localStorage.getItem("neon_chef_best") || "0", 10) || 0; } catch (e) {}
  var elapsed = 0, spawnT = 0.8, starT = 5, autoT = 0;
  var orders = [], plate = [], selected = 0;
  var star = { active: false, x: 0, y: 0, ttl: 0, spin: 0 };
  var particles = [], floats = [], bgDots = [];
  var auto = (location.search.indexOf("auto=1") !== -1);
  var downT = 0, downX = 0, downY = 0, downWasPlaying = false;
  var keys = {};
  var flashRed = 0;
  for (var i = 0; i < 60; i++) {
    bgDots.push({ x: Math.random() * L.W, y: Math.random() * L.H, s: 0.6 + Math.random() * 1.4, tw: Math.random() * Math.PI * 2 });
  }

  function spawnOrder() {
    if (orders.length >= L.maxOrders()) return false;
    S.spawned++;
    var dishIdx = Math.floor(Math.random() * L.RECIPES.length);
    var o = L.makeOrder(S.spawned, dishIdx);
    o.patience = L.orderPatience(elapsed);
    o.maxPatience = o.patience;
    orders.push(o);
    if (orders.length === 1) selected = 0;
    if (o.golden) addFloat(240, 120, "GOLDEN ORDER!", true);
    return true;
  }
  function spawnStar() {
    // Counter band, clear of the plate and the serve button.
    var x = 50 + Math.random() * 380, y = 215 + Math.random() * 55;
    if (Math.abs(x - L.PLATE.x) < 110) x = x < L.PLATE.x ? 60 : 420;
    star = { active: true, x: x, y: y, ttl: 6, spin: 0 };
  }
  function reset() {
    S = L.makeState();
    try { S.best = parseInt(localStorage.getItem("neon_chef_best") || "0", 10) || 0; } catch (e) {}
    elapsed = 0; spawnT = 0.8; starT = 5; autoT = 0;
    orders = []; plate = []; selected = 0;
    star = { active: false, x: 0, y: 0, ttl: 0, spin: 0 };
    particles = []; floats = []; flashRed = 0;
    window.__chefState = S;
  }
  function start() {
    reset();
    S.screen = "playing";
    spawnOrder();
    tone(660, 0.12, "sine", 0.2, 990);
  }
  function endGame(outOfHearts) {
    if (S.screen !== "playing") return;
    S.screen = "over";
    if (!outOfHearts && S.hearts === L.MAX_HEARTS && S.served > 0) { S.flawless = true; S.score += 500; }
    if (S.score > S.best) { S.best = S.score; try { localStorage.setItem("neon_chef_best", String(S.best)); } catch (e) {} }
    tone(220, 0.4, "sawtooth", 0.15, 110);
    tone(880, 0.3, "sine", 0.12, 660);
    window.__chefState = S;
  }
  function addFloat(x, y, text, golden) {
    floats.push({ x: x, y: y, text: text, t: 0, golden: !!golden });
  }
  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 180;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, color: color });
    }
  }
  function loseHeart(reason) {
    S.hearts--;
    S.streak = 0; S.combo = 1;
    flashRed = 0.35;
    tone(160, 0.35, "sawtooth", 0.2, 70);
    buzz([50, 40, 50]);
    addFloat(240, 250, reason + "  -1 ♥", false);
    window.__chefState = S;
    if (S.hearts <= 0) endGame(true);
  }
  // Serve the plate. Smart serve: if the plate matches ANY queued order,
  // serve that one (friendlier than forcing the selected card); otherwise
  // the serve is wrong and costs a heart.
  function serve() {
    if (S.screen !== "playing" || plate.length === 0 || orders.length === 0) return null;
    var matchIdx = -1;
    for (var i = 0; i < orders.length; i++) {
      if (L.plateMatches(orders[i].ingredients, plate)) { matchIdx = i; break; }
    }
    if (matchIdx === -1) {
      S.wrong++;
      plate = [];
      loseHeart("WRONG ORDER!");
      return { ok: false };
    }
    var o = orders[matchIdx];
    var pts = L.servePoints(S.combo, o.golden);
    S.score += pts;
    S.served++;
    S.streak++;
    S.combo = L.comboForStreak(S.streak);
    var r = L.orderSlotRect(matchIdx);
    addFloat(r.x + r.w / 2, r.y + 20, "+" + pts, o.golden);
    burst(r.x + r.w / 2, r.y + r.h / 2, o.golden ? "#ffd94a" : "#35f0ff", o.golden ? 22 : 10);
    tone(o.golden ? 1320 : 880, 0.14, "sine", 0.18, o.golden ? 1760 : 1170);
    buzz(25);
    orders.splice(matchIdx, 1);
    plate = [];
    if (selected >= orders.length) selected = Math.max(0, orders.length - 1);
    spawnT = Math.min(spawnT, 0.6);
    window.__chefState = S;
    return { ok: true, points: pts, golden: o.golden, dish: o.dish };
  }
  function addIngredient(id) {
    if (S.screen !== "playing" || plate.length >= L.PLATE_CAP) return false;
    plate.push(id);
    tone(520, 0.07, "sine", 0.12, 700);
    return true;
  }
  function collectStar() {
    if (!star.active) return false;
    var pts = L.starPoints(S.combo);
    S.score += pts; S.stars++;
    addFloat(star.x, star.y - 20, "+" + pts, false);
    burst(star.x, star.y, "#ffd94a", 10);
    tone(1170, 0.12, "sine", 0.16, 1560);
    star.active = false; star.ttl = 0; starT = 9;
    window.__chefState = S;
    return true;
  }
  // Autopilot: build the first queued order, serve it, grab stars.
  function autopilot(dt) {
    autoT -= dt;
    if (autoT > 0) return;
    autoT = 0.25;
    if (star.active) { collectStar(); return; }
    if (!orders.length) return;
    selected = 0;
    var o = orders[0];
    for (var i = 0; i < L.INGREDIENTS.length; i++) {
      var id = L.INGREDIENTS[i].id;
      if (L.missingCount(o.ingredients, plate, id) > 0) { addIngredient(id); return; }
    }
    serve();
  }

  function update(dt) {
    if (S.screen !== "playing") return;
    elapsed += dt;
    S.timeLeft = Math.max(0, L.GAME_TIME - elapsed);
    if (S.timeLeft <= 0) { endGame(false); return; }
    if (flashRed > 0) flashRed -= dt;
    // Order spawning.
    if (spawnT > 0) spawnT -= dt;
    else if (orders.length < L.maxOrders()) {
      if (spawnOrder()) spawnT = L.orderInterval(elapsed);
      else spawnT = 0.4;
    }
    // Tip star: one slot, respawns ~9s after the last one leaves.
    if (star.active) {
      star.ttl -= dt; star.spin += dt * 2;
      if (star.ttl <= 0) { star.active = false; starT = 9; }
    } else {
      starT -= dt;
      if (starT <= 0) spawnStar();
    }
    // Patience drains; an expired order costs a heart.
    for (var i = orders.length - 1; i >= 0; i--) {
      orders[i].patience -= dt;
      if (orders[i].patience <= 0) {
        var r = L.orderSlotRect(i);
        S.expired++;
        orders.splice(i, 1);
        if (selected >= orders.length) selected = Math.max(0, orders.length - 1);
        loseHeart("ORDER WALKED OUT!");
        if (S.screen !== "playing") return;
      }
    }
    if (auto) autopilot(dt);
    for (var p = particles.length - 1; p >= 0; p--) {
      var pp = particles[p];
      pp.t += dt; pp.x += pp.vx * dt; pp.y += pp.vy * dt; pp.vy += 300 * dt;
      if (pp.t > 0.6) particles.splice(p, 1);
    }
    for (var f = floats.length - 1; f >= 0; f--) {
      floats[f].t += dt; floats[f].y -= 40 * dt;
      if (floats[f].t > 1.1) floats.splice(f, 1);
    }
  }

  function drawIngIcon(x, y, r, ing) {
    // Icon drawn in local coords; gradient created AFTER the translate.
    ctx.save();
    ctx.translate(x, y);
    var g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.45, ing.color);
    g.addColorStop(1, "rgba(0,0,0,0.5)");
    ctx.fillStyle = g;
    ctx.shadowColor = ing.color; ctx.shadowBlur = 8;
    if (ing.shape === "tri") {
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r, r * 0.8); ctx.lineTo(-r, r * 0.8); ctx.closePath(); ctx.fill();
    } else if (ing.shape === "rect") {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    } else if (ing.shape === "dome") {
      ctx.beginPath(); ctx.arc(0, r * 0.3, r, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.fillRect(-r, r * 0.3, r * 2, r * 0.25);
    } else if (ing.shape === "wavy") {
      // Leaf: filled disc so the code stays readable, with a wavy vein.
      ctx.beginPath(); ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-r * 0.8, 0);
      for (var k = 0; k <= 4; k++) ctx.quadraticCurveTo(-r * 0.8 + (k + 0.5) * r * 0.4, (k % 2 === 0 ? -r * 0.5 : r * 0.5), -r * 0.8 + (k + 1) * r * 0.4, 0);
      ctx.stroke();
    } else if (ing.shape === "dots") {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(120,10,10,0.85)";
      ctx.beginPath(); ctx.arc(-r * 0.4, -r * 0.3, r * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.35, r * 0.3, r * 0.28, 0, Math.PI * 2); ctx.fill();
    } else if (ing.shape === "bowl") {
      ctx.beginPath(); ctx.arc(0, -r * 0.2, r, 0, Math.PI); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(7,5,18,0.85)";
    ctx.font = "bold " + Math.round(r * 0.62) + "px 'Segoe UI',sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(ing.code, 0, r * 0.24);
    ctx.restore();
  }
  function drawStarShape(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = "#ffd94a"; ctx.shadowColor = "#ffd94a"; ctx.shadowBlur = 12;
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4, rr = (i % 2 === 0) ? r : r * 0.45;
      var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function render() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
    var bg = ctx.createLinearGradient(0, 0, 0, L.H);
    bg.addColorStop(0, "#0a0a24");
    bg.addColorStop(0.5, "#120a30");
    bg.addColorStop(1, "#1a0a2e");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, L.W, L.H);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, L.W, L.H); ctx.clip();
    for (var i = 0; i < bgDots.length; i++) {
      var bd = bgDots[i];
      ctx.globalAlpha = 0.3 + 0.4 * Math.abs(Math.sin(bd.tw + performance.now() / 900));
      ctx.fillStyle = "#3a6bff";
      ctx.beginPath(); ctx.arc(bd.x, bd.y, bd.s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Counter band behind the plate.
    ctx.fillStyle = "#1a1440";
    ctx.fillRect(0, 204, L.W, 258);
    ctx.strokeStyle = "rgba(53,240,255,0.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 204); ctx.lineTo(L.W, 204); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 462); ctx.lineTo(L.W, 462); ctx.stroke();
    ctx.fillStyle = "#9ff3ff";
    ctx.font = "bold 13px 'Segoe UI',sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("— YOUR PLATE —", L.W / 2, 222);
    // Order cards.
    for (var o = 0; o < orders.length; o++) {
      var ord = orders[o];
      var r = L.orderSlotRect(o);
      var sel = (o === selected);
      ctx.save();
      ctx.fillStyle = "#151c3f";
      ctx.strokeStyle = ord.golden ? "#ffd94a" : (sel ? "#35f0ff" : "#2b3572");
      ctx.lineWidth = sel || ord.golden ? 3 : 1.5;
      if (sel) { ctx.shadowColor = "#35f0ff"; ctx.shadowBlur = 12; }
      else if (ord.golden) { ctx.shadowColor = "#ffd94a"; ctx.shadowBlur = 12; }
      ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = ord.color;
      ctx.font = "bold 16px 'Segoe UI',sans-serif";
      ctx.textAlign = "center";
      ctx.fillText((ord.golden ? "★ " : "") + ord.dish, r.x + r.w / 2, r.y + 24);
      // Ingredient chips.
      var chipW = 40, chipGap = 6;
      var totalW = ord.ingredients.length * chipW + (ord.ingredients.length - 1) * chipGap;
      var cx = r.x + (r.w - totalW) / 2 + chipW / 2;
      for (var c = 0; c < ord.ingredients.length; c++) {
        var ing = L.ingredientById(ord.ingredients[c]);
        drawIngIcon(cx, r.y + 58, 15, ing);
        cx += chipW + chipGap;
      }
      // Patience bar.
      var frac = Math.max(0, ord.patience / ord.maxPatience);
      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.fillRect(r.x + 10, r.y + r.h - 18, r.w - 20, 8);
      ctx.fillStyle = frac > 0.5 ? "#7dff5e" : (frac > 0.25 ? "#ffd94a" : "#ff5e7a");
      ctx.fillRect(r.x + 10, r.y + r.h - 18, (r.w - 20) * frac, 8);
      ctx.restore();
    }
    // Empty order slots hint.
    if (orders.length === 0 && S.screen === "playing") {
      ctx.fillStyle = "#9ff3ff";
      ctx.font = "16px 'Segoe UI',sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Orders incoming…", L.W / 2, 150);
    }
    // Plate.
    ctx.save();
    var pg = ctx.createRadialGradient(L.PLATE.x, L.PLATE.y, 10, L.PLATE.x, L.PLATE.y, L.PLATE.r);
    pg.addColorStop(0, "#2a2350");
    pg.addColorStop(0.8, "#17123a");
    pg.addColorStop(1, "#0d0a26");
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(L.PLATE.x, L.PLATE.y, L.PLATE.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = plate.length ? "#35f0ff" : "rgba(53,240,255,0.4)";
    ctx.lineWidth = 3;
    ctx.shadowColor = "#35f0ff"; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(L.PLATE.x, L.PLATE.y, L.PLATE.r, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
    if (plate.length === 0) {
      ctx.fillStyle = "rgba(159,243,255,0.6)";
      ctx.font = "15px 'Segoe UI',sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Tap ingredients", L.PLATE.x, L.PLATE.y - 6);
      ctx.fillText("to build the dish", L.PLATE.x, L.PLATE.y + 16);
    } else {
      // Chips arranged in a row (max 5), tap one to remove it.
      var pw = 34, pgap = 6;
      var ptotal = plate.length * pw + (plate.length - 1) * pgap;
      var px = L.PLATE.x - ptotal / 2 + pw / 2;
      for (var pi = 0; pi < plate.length; pi++) {
        drawIngIcon(px, L.PLATE.y, 15, L.ingredientById(plate[pi]));
        px += pw + pgap;
      }
      ctx.fillStyle = "#9ff3ff";
      ctx.font = "12px 'Segoe UI',sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("tap a chip to remove it", L.PLATE.x, L.PLATE.y + L.PLATE.r - 14);
    }
    ctx.restore();
    // Tip star.
    if (star.active) drawStarShape(star.x, star.y, 16, star.spin);
    // SERVE button.
    var sv = L.serveRect();
    ctx.save();
    var sg = ctx.createLinearGradient(sv.x, sv.y, sv.x + sv.w, sv.y);
    sg.addColorStop(0, plate.length ? "#0fbf7f" : "#2a2f55");
    sg.addColorStop(1, plate.length ? "#35f0ff" : "#3a3f66");
    ctx.fillStyle = sg;
    ctx.strokeStyle = plate.length ? "#7dff5e" : "#555fa0";
    ctx.lineWidth = 2;
    if (plate.length) { ctx.shadowColor = "#7dff5e"; ctx.shadowBlur = 14; }
    ctx.beginPath(); ctx.rect(sv.x, sv.y, sv.w, sv.h); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = plate.length ? "#ffffff" : "#9aa3cc";
    ctx.font = "bold 26px 'Segoe UI',sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("SERVE ✓", sv.x + sv.w / 2, sv.y + 38);
    ctx.restore();
    // Ingredient buttons.
    for (var b = 0; b < L.INGREDIENTS.length; b++) {
      var br = L.ingButtonRect(b);
      var ing = L.INGREDIENTS[b];
      ctx.save();
      ctx.fillStyle = "#151c3f";
      ctx.strokeStyle = "#2b3572"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.rect(br.x, br.y, br.w, br.h); ctx.fill(); ctx.stroke();
      drawIngIcon(br.x + br.w / 2, br.y + 38, 20, ing);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px 'Segoe UI',sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(ing.name, br.x + br.w / 2, br.y + 84);
      ctx.restore();
    }
    // Particles.
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, 1 - pt.t / 0.6);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Floating score text.
    ctx.textAlign = "center";
    for (var f = 0; f < floats.length; f++) {
      var fl = floats[f];
      ctx.globalAlpha = Math.max(0, 1 - fl.t / 1.1);
      ctx.fillStyle = fl.golden ? "#ffd94a" : "#ffffff";
      ctx.font = "bold 22px 'Segoe UI',sans-serif";
      ctx.fillText(fl.text, fl.x, fl.y);
    }
    ctx.globalAlpha = 1;
    if (flashRed > 0) {
      ctx.fillStyle = "rgba(255,60,90," + (flashRed * 0.5) + ")";
      ctx.fillRect(0, 0, L.W, L.H);
    }
    ctx.restore();
    if (S.screen === "title") drawTitle();
    else if (S.screen === "over") drawOver();
    if (S.screen === "playing" || S.screen === "over") drawHUD();
  }
  function drawHUD() {
    ctx.save();
    ctx.fillStyle = "rgba(4,8,24,0.88)";
    ctx.fillRect(0, 0, L.W, 76);
    ctx.strokeStyle = "rgba(53,240,255,0.4)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 76); ctx.lineTo(L.W, 76); ctx.stroke();
    ctx.textAlign = "left";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 26px 'Segoe UI',sans-serif";
    ctx.fillText("SCORE " + S.score, 14, 34);
    ctx.font = "bold 15px 'Segoe UI',sans-serif";
    ctx.fillStyle = S.combo > 1 ? "#ffd94a" : "#9ff3ff";
    ctx.fillText("COMBO x" + S.combo + "  ·  SERVED " + S.served, 14, 60);
    ctx.textAlign = "center";
    ctx.fillStyle = S.timeLeft <= 10 ? "#ff5e7a" : "#ffffff";
    ctx.font = "bold 30px 'Segoe UI',sans-serif";
    ctx.fillText(Math.ceil(S.timeLeft) + "s", L.W / 2, 36);
    ctx.font = "bold 13px 'Segoe UI',sans-serif";
    ctx.fillStyle = "#9ff3ff";
    ctx.fillText("BEST " + S.best, L.W / 2, 60);
    ctx.textAlign = "right";
    ctx.font = "bold 22px 'Segoe UI',sans-serif";
    ctx.fillStyle = "#ff5e7a";
    var hearts = "";
    for (var h = 0; h < L.MAX_HEARTS; h++) hearts += h < S.hearts ? "♥" : "♡";
    ctx.fillText(hearts, L.W - 14, 34);
    ctx.font = "bold 13px 'Segoe UI',sans-serif";
    ctx.fillStyle = "#9ff3ff";
    ctx.fillText("STARS " + S.stars + "  ·  WRONG " + S.wrong, L.W - 14, 60);
    ctx.restore();
  }
  function drawTitle() {
    ctx.save();
    ctx.fillStyle = "rgba(4,8,24,0.9)";
    ctx.fillRect(0, 0, L.W, L.H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#35f0ff";
    ctx.shadowColor = "#35f0ff"; ctx.shadowBlur = 18;
    ctx.font = "bold 50px 'Segoe UI',sans-serif";
    ctx.fillText("NEON", L.W / 2, 210);
    ctx.fillStyle = "#ff9d5c";
    ctx.shadowColor = "#ff9d5c";
    ctx.fillText("CHEF", L.W / 2, 268);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 19px 'Segoe UI',sans-serif";
    ctx.fillText("60 seconds of neon cooking chaos!", L.W / 2, 312);
    ctx.fillStyle = "#9ff3ff";
    ctx.font = "17px 'Segoe UI',sans-serif";
    ctx.fillText("Tap an order, then tap ingredients", L.W / 2, 360);
    ctx.fillText("to build the dish on your plate", L.W / 2, 388);
    ctx.fillText("Tap SERVE before patience runs out", L.W / 2, 416);
    ctx.fillText("Wrong serve or walk-out costs a heart", L.W / 2, 444);
    ctx.fillStyle = "#ffd94a";
    ctx.fillText("Serves pay 100 x combo · Golden orders 5x", L.W / 2, 486);
    ctx.fillText("Tip stars pay 50 x combo · 3 hearts", L.W / 2, 514);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 21px 'Segoe UI',sans-serif";
    var pulse = 0.7 + 0.3 * Math.sin(performance.now() / 300);
    ctx.globalAlpha = pulse;
    ctx.fillText("TAP TO START", L.W / 2, 580);
    ctx.globalAlpha = 1;
    ctx.font = "15px 'Segoe UI',sans-serif";
    ctx.fillStyle = "#9ff3ff";
    ctx.fillText("BEST " + S.best, L.W / 2, 618);
    ctx.restore();
  }
  function drawOver() {
    ctx.save();
    ctx.fillStyle = "rgba(4,8,24,0.82)";
    ctx.fillRect(0, 0, L.W, L.H);
    ctx.textAlign = "center";
    ctx.fillStyle = S.hearts <= 0 ? "#ff5e7a" : "#35f0ff";
    ctx.shadowColor = S.hearts <= 0 ? "#ff5e7a" : "#35f0ff"; ctx.shadowBlur = 18;
    ctx.font = "bold 44px 'Segoe UI',sans-serif";
    ctx.fillText(S.hearts <= 0 ? "KITCHEN CLOSED!" : "TIME'S UP!", L.W / 2, 250);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 30px 'Segoe UI',sans-serif";
    ctx.fillText("SCORE " + S.score, L.W / 2, 320);
    ctx.fillStyle = "#9ff3ff";
    ctx.font = "19px 'Segoe UI',sans-serif";
    ctx.fillText("Served " + S.served + "  ·  Stars " + S.stars + "  ·  Wrong " + S.wrong, L.W / 2, 360);
    if (S.flawless) {
      ctx.fillStyle = "#ffd94a";
      ctx.font = "bold 20px 'Segoe UI',sans-serif";
      ctx.fillText("FLAWLESS +500 — no hearts lost!", L.W / 2, 396);
    }
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 19px 'Segoe UI',sans-serif";
    ctx.fillText("BEST " + S.best, L.W / 2, 440);
    var pulse = 0.7 + 0.3 * Math.sin(performance.now() / 300);
    ctx.globalAlpha = pulse;
    ctx.fillText("TAP TO PLAY AGAIN", L.W / 2, 520);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function toWorld(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
  }
  // Tap targets, checked in priority order: star, order cards, plate
  // chips (remove), SERVE, ingredient buttons.
  function handleTap(w) {
    if (S.screen !== "playing") return;
    if (star.active && Math.hypot(w.x - star.x, w.y - star.y) < 26) { collectStar(); return; }
    for (var i = 0; i < orders.length; i++) {
      if (L.pointInRect(w.x, w.y, L.orderSlotRect(i))) {
        selected = i;
        tone(700, 0.06, "sine", 0.1);
        return;
      }
    }
    if (plate.length) {
      var pw = 34, pgap = 6;
      var ptotal = plate.length * pw + (plate.length - 1) * pgap;
      var px = L.PLATE.x - ptotal / 2;
      for (var c = 0; c < plate.length; c++) {
        if (Math.hypot(w.x - (px + pw / 2), w.y - L.PLATE.y) < 20) {
          plate.splice(c, 1);
          tone(420, 0.06, "sine", 0.1);
          return;
        }
        px += pw + pgap;
      }
    }
    if (L.pointInRect(w.x, w.y, L.serveRect())) { serve(); return; }
    for (var b = 0; b < L.INGREDIENTS.length; b++) {
      if (L.pointInRect(w.x, w.y, L.ingButtonRect(b))) { addIngredient(L.INGREDIENTS[b].id); return; }
    }
  }
  function onDown(e) {
    if (S.screen === "title" || S.screen === "over") {
      downWasPlaying = false;
      start();
      downT = performance.now(); downX = e.clientX; downY = e.clientY;
      return;
    }
    downWasPlaying = true;
    downT = performance.now(); downX = e.clientX; downY = e.clientY;
    e.preventDefault();
  }
  function onUp(e) {
    if (!downWasPlaying) return;
    var dtMs = performance.now() - downT;
    var moved = Math.sqrt((e.clientX - downX) * (e.clientX - downX) + (e.clientY - downY) * (e.clientY - downY));
    // A quick tap with almost no movement = a button press.
    if (dtMs < 400 && moved < 18) {
      handleTap(toWorld(e));
    }
  }
  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", function () { downWasPlaying = false; });
  window.addEventListener("keydown", function (e) {
    keys[e.key] = true;
    if (e.key === "Enter" && (S.screen === "title" || S.screen === "over")) start();
    else if (S.screen === "playing") {
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= 8) addIngredient(L.INGREDIENTS[n - 1].id);
      else if (e.key === "s" || e.key === "S" || e.key === " ") { serve(); e.preventDefault(); }
      else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        if (orders.length) selected = (selected + (e.key === "ArrowRight" ? 1 : -1) + orders.length) % orders.length;
      }
    }
    if (e.key === "m" || e.key === "M") { muted = !muted; try { localStorage.setItem("neon_chef_mute", muted ? "1" : "0"); } catch (err) {} }
  });
  window.addEventListener("keyup", function (e) { keys[e.key] = false; });

  window.__chefState = S;
  window.__chefDebug = {
    state: function () { return { screen: S.screen, score: S.score, combo: S.combo, streak: S.streak, served: S.served, wrong: S.wrong, expired: S.expired, hearts: S.hearts, timeLeft: Math.round(S.timeLeft * 10) / 10, stars: S.stars, spawned: S.spawned, orders: orders.length, plate: plate.length, selected: selected }; },
    orders: function () { return orders.map(function (o) { return { dish: o.dish, ingredients: o.ingredients.slice(), golden: o.golden, patience: Math.round(o.patience * 10) / 10 }; }); },
    plate: function () { return plate.slice(); },
    start: function () { start(); },
    select: function (i) { if (orders[i]) selected = i; return selected; },
    addIng: function (id) { return addIngredient(id); },
    serve: function () { return serve(); },
    setAuto: function (v) { auto = v; },
    // Build the first order's exact recipe and serve it: the score
    // must rise by exactly 100 x combo (x5 if golden).
    debugServe: function () {
      if (S.screen !== "playing" || !orders.length) return null;
      var o = orders[0];
      var before = { score: S.score, combo: S.combo, served: S.served };
      plate = o.ingredients.slice();
      var res = serve();
      return { golden: o.golden, before: before, after: { score: S.score, served: S.served }, points: res ? res.points : 0 };
    },
    // Add an ingredient the first order does NOT need, then serve:
    // the serve must be wrong — exactly one heart lost, combo reset.
    debugWrongServe: function () {
      if (S.screen !== "playing" || !orders.length) return null;
      var o = orders[0];
      var wrongId = null;
      for (var i = 0; i < L.INGREDIENTS.length; i++) {
        if (o.ingredients.indexOf(L.INGREDIENTS[i].id) === -1) { wrongId = L.INGREDIENTS[i].id; break; }
      }
      var before = { hearts: S.hearts, wrong: S.wrong, combo: S.combo };
      plate = o.ingredients.slice();
      plate.push(wrongId);
      serve();
      return { wrongId: wrongId, before: before, after: { hearts: S.hearts, wrong: S.wrong, combo: S.combo } };
    },
    // Set the first order's patience near zero: the next step must
    // expire it for exactly one heart.
    debugExpire: function () {
      if (S.screen !== "playing" || !orders.length) return null;
      var before = { hearts: S.hearts, expired: S.expired };
      orders[0].patience = 0.05;
      return { dish: orders[0].dish, before: before };
    },
    // Place a tip star at a fixed spot and return its world coords so
    // the phone check can tap it for exactly 50 x combo.
    debugStar: function () {
      if (S.screen !== "playing") return null;
      star = { active: true, x: 70, y: 250, ttl: 30, spin: 0 };
      return { x: 70, y: 250, combo: S.combo, score: S.score, stars: S.stars };
    }
  };

  reset();
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (auto) start();
})();
</script>
</body>
</html>
