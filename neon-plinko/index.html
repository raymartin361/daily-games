<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Plinko — Day 27</title>
<meta name="description" content="Neon Plinko — 60 seconds of pachinko chaos. Aim the dropper, drop the balls, ride the pegs into the golden x10 slot.">
<script data-goatcounter="https://raymartin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
html,body{overflow:hidden;position:fixed;width:100%;overscroll-behavior:none}
html,body{height:100%;margin:0;padding:0;background:#070512;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'Segoe UI',system-ui,sans-serif}
#c{position:fixed;inset:0;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* Neon Plinko — Day 27. Pachinko: aim the dropper, drop balls through a neon
   peg field, land in multiplier slots. Center GOLD slot pays x10 and shifts
   every 12s. Combo ladder x1->x5 on hot slots (>=x3); cold slots (x1/x2) reset.
   Every 8th ball is GOLDEN (5x score). 60 seconds, best score persisted. */
if (typeof document !== "undefined") {
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
}

//LOGIC-START
var PlinkoLogic = (function () {
  function makeRng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  // WIDE PLAYFIELD: world width scales with the viewport (min 480 so mobile
  // is unchanged, capped at 1120), instead of a fixed 480 fit.
  function computeWorld(vw) {
    var w = Math.round(vw * 0.92);
    if (w < 480) w = 480;
    if (w > 1120) w = 1120;
    return { w: w, h: 800 };
  }

  var SLOT_COUNT = 9;
  var BASE_MULTS = [1, 2, 3, 1, 2, 1, 3, 2, 1];
  var GOLD_MULT = 10;
  var GOLD_MIN = 2, GOLD_MAX = 6; // gold slot stays central-ish

  function multsFor(goldIndex) {
    var m = BASE_MULTS.slice();
    m[goldIndex] = GOLD_MULT;
    return m;
  }
  function slotIndexFor(x, W) {
    var sw = W / SLOT_COUNT;
    var i = Math.floor(x / sw);
    if (i < 0) i = 0;
    if (i >= SLOT_COUNT) i = SLOT_COUNT - 1;
    return i;
  }
  // combo: hot slots (x3+) step the ladder up to x5; cold slots reset to x1
  function nextCombo(mult, combo) {
    if (mult >= 3) return combo >= 5 ? 5 : combo + 1;
    return 1;
  }
  function scoreForBall(mult, combo, golden) {
    return 10 * mult * combo * (golden ? 5 : 1);
  }
  function isGolden(dropCount) { return dropCount % 8 === 7; } // every 8th ball

  function shiftGold(goldIndex, dir) {
    var ni = goldIndex + dir, nd = dir;
    if (ni > GOLD_MAX) { ni = GOLD_MAX - 1; nd = -1; }
    if (ni < GOLD_MIN) { ni = GOLD_MIN + 1; nd = 1; }
    return { index: ni, dir: nd };
  }

  function pegField(W) {
    var pegs = [];
    var sx = W / 10, yTop = 190, dy = 54, rows = 9, r = 6;
    for (var row = 0; row < rows; row++) {
      var y = yTop + row * dy;
      var off = (row % 2) ? sx / 2 : 0;
      for (var k = 0; k <= 10; k++) {
        var x = off + k * sx;
        if (x < 34 || x > W - 34) continue;
        pegs.push({ x: x, y: y, r: r, flash: 0 });
      }
    }
    return pegs;
  }

  var GRAV = 1500, REST = 0.55, JITTER = 70;
  function makeBall(x, golden) {
    return { x: x, y: 142, vx: 0, vy: 40, r: 10, golden: !!golden, trail: [] };
  }
  // Steps one ball; returns null while falling, or {slot, x} when it lands.
  // hooks: {onPeg(x, y, speed), onWall()}
  function stepBall(ball, pegs, W, dt, rng, hooks) {
    hooks = hooks || {};
    ball.vy += GRAV * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    if (ball.trail.length > 14) ball.trail.shift();
    ball.trail.push(ball.x, ball.y);
    // side walls
    if (ball.x < ball.r + 6) { ball.x = ball.r + 6; if (ball.vx < 0) { ball.vx = -ball.vx * 0.4; hooks.onWall && hooks.onWall(); } }
    if (ball.x > W - ball.r - 6) { ball.x = W - ball.r - 6; if (ball.vx > 0) { ball.vx = -ball.vx * 0.4; hooks.onWall && hooks.onWall(); } }
    // peg collisions
    for (var i = 0; i < pegs.length; i++) {
      var p = pegs[i];
      var dx = ball.x - p.x, dy = ball.y - p.y;
      var minD = ball.r + p.r;
      var d2 = dx * dx + dy * dy;
      if (d2 < minD * minD && d2 > 1e-6) {
        var d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
        ball.x = p.x + nx * minD;
        ball.y = p.y + ny * minD;
        var vn = ball.vx * nx + ball.vy * ny;
        if (vn < 0) {
          var sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
          ball.vx -= (1 + REST) * vn * nx;
          ball.vy -= (1 + REST) * vn * ny;
          ball.vx += (rng() * 2 - 1) * JITTER;
          p.flash = 0.12;
          hooks.onPeg && hooks.onPeg(p.x, p.y, sp);
        }
      }
    }
    if (ball.y >= 660) return { slot: slotIndexFor(ball.x, W), x: ball.x };
    return null;
  }

  function clampDropper(x, W) {
    if (x < 36) return 36;
    if (x > W - 36) return W - 36;
    return x;
  }

  return {
    makeRng: makeRng,
    computeWorld: computeWorld,
    SLOT_COUNT: SLOT_COUNT,
    BASE_MULTS: BASE_MULTS,
    GOLD_MULT: GOLD_MULT,
    multsFor: multsFor,
    slotIndexFor: slotIndexFor,
    nextCombo: nextCombo,
    scoreForBall: scoreForBall,
    isGolden: isGolden,
    shiftGold: shiftGold,
    pegField: pegField,
    makeBall: makeBall,
    stepBall: stepBall,
    clampDropper: clampDropper,
    GRAV: GRAV
  };
})();
//LOGIC-END

(function () {
  var L = PlinkoLogic;
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var vw = 0, vh = 0, dpr = 1, scale = 1, ox = 0, oy = 0;
  var WD = L.computeWorld(480);
  var pegs = L.pegField(WD.w);

  function resize() {
    vw = window.innerWidth; vh = window.innerHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = vw * dpr; canvas.height = vh * dpr;
    canvas.style.width = vw + "px"; canvas.style.height = vh + "px";
    WD = L.computeWorld(vw);
    pegs = L.pegField(WD.w);
    scale = Math.min(vw / WD.w, vh / WD.h);
    ox = (vw - WD.w * scale) / 2;
    oy = (vh - WD.h * scale) / 2;
    dropperX = L.clampDropper(dropperX || WD.w / 2, WD.w);
  }
  window.addEventListener("resize", resize);

  // ---- audio ----
  var AC = null, muted = false;
  try { muted = localStorage.getItem("neon_plinko_mute") === "1"; } catch (e) {}
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === "suspended") AC.resume();
    return AC;
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (muted) return;
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.08, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  }
  var lastTick = 0;
  function pegTick(speed) {
    var now = performance.now();
    if (now - lastTick < 40) return;
    lastTick = now;
    var f = 500 + Math.min(900, speed * 0.5);
    tone(f, 0.05, "square", 0.03);
  }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  // ---- state ----
  var screen = "title";
  var score = 0, best = 0, combo = 1, timeLeft = 60;
  var balls = [], popups = [];
  var dropperX = WD.w / 2, dropCooldown = 0, dropCount = 0;
  var goldIndex = 4, goldDir = 1, goldT = 0;
  var shakeT = 0, lastT = 0, elapsed = 0;
  try { best = parseInt(localStorage.getItem("neon_plinko_best") || "0", 10) || 0; } catch (e) {}

  function startGame() {
    screen = "play"; score = 0; combo = 1; timeLeft = 60;
    balls = []; popups = []; dropCount = 0; dropCooldown = 0;
    goldIndex = 4; goldDir = 1; goldT = 0; shakeT = 0; elapsed = 0;
    lastT = performance.now();
    tone(300, 0.15, "sine", 0.08, 600);
  }

  function landBall(b, slot) {
    var mults = L.multsFor(goldIndex);
    var mult = mults[slot];
    combo = L.nextCombo(mult, combo);
    var pts = L.scoreForBall(mult, combo, b.golden);
    score += pts;
    popups.push({ x: b.x, y: 640, text: "+" + pts, t: 1, big: mult >= L.GOLD_MULT || b.golden });
    if (mult >= L.GOLD_MULT) {
      shakeT = 0.35; buzz([40, 40, 60]);
      tone(660, 0.12, "triangle", 0.1); setTimeout(function () { tone(880, 0.12, "triangle", 0.1); }, 90);
      setTimeout(function () { tone(1320, 0.2, "triangle", 0.1); }, 180);
    } else if (mult >= 3) { buzz(25); tone(520, 0.08, "triangle", 0.07); }
    else { tone(300, 0.06, "sine", 0.05); }
  }

  function drop() {
    if (screen !== "play" || dropCooldown > 0) return;
    dropCooldown = 0.45;
    var golden = L.isGolden(dropCount);
    dropCount++;
    balls.push(L.makeBall(dropperX, golden));
    tone(golden ? 900 : 440, 0.1, "sine", 0.06, golden ? 1400 : 220);
  }

  function toGame(cx, cy) {
    var r = canvas.getBoundingClientRect();
    return { x: (cx - r.left - ox) / scale, y: (cy - r.top - oy) / scale };
  }
  var aiming = false;
  canvas.addEventListener("pointerdown", function (e) {
    ac();
    var p = toGame(e.clientX, e.clientY);
    if (screen === "title") { startGame(); return; }
    if (screen === "over") { startGame(); return; }
    // mute button zone (top-right)
    if (p.x > WD.w - 64 && p.y < 64) {
      muted = !muted;
      try { localStorage.setItem("neon_plinko_mute", muted ? "1" : "0"); } catch (e2) {}
      return;
    }
    aiming = true;
    dropperX = L.clampDropper(p.x, WD.w);
    drop();
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!aiming || screen !== "play") return;
    var p = toGame(e.clientX, e.clientY);
    dropperX = L.clampDropper(p.x, WD.w);
  });
  window.addEventListener("pointerup", function () { aiming = false; });
  document.addEventListener("keydown", function (e) {
    if (e.key === "m" || e.key === "M") {
      muted = !muted;
      try { localStorage.setItem("neon_plinko_mute", muted ? "1" : "0"); } catch (e2) {}
    } else if (e.key === "ArrowLeft") dropperX = L.clampDropper(dropperX - 24, WD.w);
    else if (e.key === "ArrowRight") dropperX = L.clampDropper(dropperX + 24, WD.w);
    else if (e.key === " " || e.key === "Enter") {
      if (screen !== "play") startGame(); else drop();
    }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) lastT = performance.now();
  });

  function update(dt) {
    elapsed += dt;
    if (screen !== "play") return;
    timeLeft -= dt;
    dropCooldown = Math.max(0, dropCooldown - dt);
    goldT += dt;
    if (goldT >= 12) {
      goldT = 0;
      var r = L.shiftGold(goldIndex, goldDir);
      goldIndex = r.index; goldDir = r.dir;
      popups.push({ x: WD.w / 2, y: 300, text: "GOLD SHIFT!", t: 1.2, big: true });
      tone(700, 0.15, "triangle", 0.07, 1100);
    }
    var rng = Math.random;
    for (var i = balls.length - 1; i >= 0; i--) {
      var b = balls[i];
      var res = L.stepBall(b, pegs, WD.w, dt, rng, { onPeg: pegTick });
      if (res) { landBall(b, res.slot); balls.splice(i, 1); }
    }
    for (var j = popups.length - 1; j >= 0; j--) {
      popups[j].t -= dt;
      if (popups[j].t <= 0) popups.splice(j, 1);
    }
    for (var k = 0; k < pegs.length; k++) pegs[k].flash = Math.max(0, pegs[k].flash - dt);
    shakeT = Math.max(0, shakeT - dt);
    if (timeLeft <= 0) {
      timeLeft = 0; screen = "over";
      if (score > best) {
        best = score;
        try { localStorage.setItem("neon_plinko_best", String(best)); } catch (e) {}
      }
      tone(500, 0.3, "sine", 0.08, 200);
      buzz([60, 60, 60]);
    }
  }

  function drawBall(b) {
    // trail: ONE continuous ribbon. Stroking each segment separately with
    // round caps renders as a dotted chain of mini-balls at speed.
    if (b.trail.length >= 4) {
      ctx.save();
      ctx.strokeStyle = b.golden ? "rgba(255,210,80,0.28)" : "rgba(80,200,255,0.28)";
      ctx.lineWidth = b.r * 0.9; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(b.trail[0], b.trail[1]);
      for (var i = 2; i < b.trail.length; i += 2) ctx.lineTo(b.trail[i], b.trail[i + 1]);
      ctx.stroke();
      ctx.restore();
    }
    var g = ctx.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, b.r);
    if (b.golden) { g.addColorStop(0, "#fff6c8"); g.addColorStop(0.5, "#ffd23f"); g.addColorStop(1, "#b97b00"); }
    else { g.addColorStop(0, "#d8f6ff"); g.addColorStop(0.5, "#38c8ff"); g.addColorStop(1, "#0a5f9e"); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    if (b.golden) {
      ctx.strokeStyle = "rgba(255,220,120,0.9)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 4, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#070512";
    ctx.fillRect(0, 0, vw, vh);
    var shx = 0, shy = 0;
    if (shakeT > 0) { shx = (Math.random() * 2 - 1) * 8 * shakeT; shy = (Math.random() * 2 - 1) * 8 * shakeT; }
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, (ox + shx * scale) * dpr, (oy + shy * scale) * dpr);
    var W = WD.w;

    // pegs
    for (var i = 0; i < pegs.length; i++) {
      var p = pegs[i];
      var fl = p.flash > 0 ? p.flash / 0.12 : 0;
      ctx.fillStyle = fl > 0 ? "#ffffff" : "#b14dff";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + fl * 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(177,77,255,0.25)";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 5, 0, Math.PI * 2); ctx.fill();
    }

    // slots
    var sw = W / L.SLOT_COUNT, mults = L.multsFor(goldIndex);
    for (var s = 0; s < L.SLOT_COUNT; s++) {
      var x0 = s * sw;
      var isGold = mults[s] >= L.GOLD_MULT;
      var pulse = isGold ? 0.6 + 0.4 * Math.sin(elapsed * 6) : 0;
      ctx.fillStyle = isGold ? "rgba(255,200,60," + (0.25 + pulse * 0.25) + ")" :
        (mults[s] >= 3 ? "rgba(60,255,170,0.10)" : "rgba(120,140,255,0.07)");
      ctx.fillRect(x0 + 2, 660, sw - 4, 100);
      ctx.strokeStyle = isGold ? "#ffd23f" : "rgba(150,160,255,0.35)";
      ctx.lineWidth = isGold ? 3 : 1;
      ctx.strokeRect(x0 + 2, 660, sw - 4, 100);
      ctx.fillStyle = isGold ? "#ffd23f" : (mults[s] >= 3 ? "#3cffa0" : "#aab4ff");
      ctx.font = "bold " + (isGold ? 30 : 24) + "px system-ui";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(isGold ? "x10" : "x" + mults[s], x0 + sw / 2, 710);
    }

    // dropper: a hollow funnel, deliberately NOT ball-shaped — a filled
    // circle here reads as a second ball sitting at the emitter
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.lineJoin = "round";
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.beginPath();
    ctx.moveTo(dropperX - 17, 98); ctx.lineTo(dropperX + 17, 98);
    ctx.lineTo(dropperX, 124); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "rgba(56,200,255,0.5)"; ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(dropperX, 130); ctx.lineTo(dropperX, 180); ctx.stroke();
    ctx.setLineDash([]);

    for (var b2 = 0; b2 < balls.length; b2++) drawBall(balls[b2]);

    // popups
    ctx.textAlign = "center";
    for (var q = 0; q < popups.length; q++) {
      var pp = popups[q];
      ctx.globalAlpha = Math.min(1, pp.t * 2);
      ctx.fillStyle = pp.big ? "#ffd23f" : "#ffffff";
      ctx.font = "bold " + (pp.big ? 34 : 24) + "px system-ui";
      ctx.fillText(pp.text, pp.x, pp.y - (1 - pp.t) * 60);
      ctx.globalAlpha = 1;
    }

    // HUD (screen space)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = "bold 20px system-ui";
    ctx.fillText("SCORE " + score, 14, 12);
    ctx.fillStyle = combo > 1 ? "#ffd23f" : "#8a93b8";
    ctx.fillText("COMBO x" + combo, 14, 38);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "bold 26px system-ui";
    ctx.fillStyle = timeLeft <= 10 && screen === "play" ? "#ff5b5b" : "#fff";
    ctx.fillText(Math.ceil(timeLeft) + "s", vw / 2, 10);
    ctx.textAlign = "right"; ctx.fillStyle = "#8a93b8"; ctx.font = "bold 16px system-ui";
    ctx.fillText("BEST " + best, vw - 64, 14);
    ctx.font = "20px system-ui";
    ctx.fillText(muted ? "🔇" : "🔊", vw - 24, 10);

    if (screen === "title") {
      ctx.fillStyle = "rgba(4,2,16,0.82)";
      ctx.fillRect(0, 0, vw, vh);
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffd23f"; ctx.font = "bold 54px system-ui";
      ctx.fillText("NEON PLINKO", vw / 2, vh / 2 - 120);
      ctx.fillStyle = "#c9d2ff"; ctx.font = "20px system-ui";
      ctx.fillText("Aim the dropper — tap to drop a ball.", vw / 2, vh / 2 - 60);
      ctx.fillText("Ride the pegs into the multiplier slots.", vw / 2, vh / 2 - 30);
      ctx.fillStyle = "#3cffa0";
      ctx.fillText("Hot slots (x3+) build your combo to x5.", vw / 2, vh / 2 + 2);
      ctx.fillStyle = "#ffd23f";
      ctx.fillText("Every 8th ball is GOLDEN (5x). The GOLD x10 slot shifts!", vw / 2, vh / 2 + 32);
      ctx.fillStyle = "#fff"; ctx.font = "bold 26px system-ui";
      ctx.fillText("— TAP TO START —", vw / 2, vh / 2 + 90);
      ctx.fillStyle = "#8a93b8"; ctx.font = "16px system-ui";
      ctx.fillText("Best: " + best, vw / 2, vh / 2 + 125);
    } else if (screen === "over") {
      ctx.fillStyle = "rgba(4,2,16,0.85)";
      ctx.fillRect(0, 0, vw, vh);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff"; ctx.font = "bold 44px system-ui";
      ctx.fillText("TIME UP!", vw / 2, vh / 2 - 90);
      ctx.fillStyle = "#ffd23f"; ctx.font = "bold 60px system-ui";
      ctx.fillText(String(score), vw / 2, vh / 2 - 20);
      ctx.fillStyle = score >= best && score > 0 ? "#3cffa0" : "#8a93b8";
      ctx.font = "22px system-ui";
      ctx.fillText(score >= best && score > 0 ? "NEW BEST!" : "Best: " + best, vw / 2, vh / 2 + 40);
      ctx.fillStyle = "#fff"; ctx.font = "bold 24px system-ui";
      ctx.fillText("— TAP TO PLAY AGAIN —", vw / 2, vh / 2 + 95);
    }
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
    lastT = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  lastT = performance.now();
  requestAnimationFrame(frame);

  // debug hook for automated smoke tests
  window.NeonPlinko = {
    logic: L,
    getState: function () {
      return { screen: screen, score: score, combo: combo, timeLeft: timeLeft, balls: balls.length, dropCount: dropCount, goldIndex: goldIndex };
    },
    start: startGame,
    drop: drop,
    setDropper: function (x) { dropperX = L.clampDropper(x, WD.w); },
    worldW: function () { return WD.w; }
  };
})();
</script>
</body>
</html>
