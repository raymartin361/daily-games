<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Whack — Day 31</title>
<meta name="description" content="Neon Whack — 60 seconds of whack-a-mole chaos. Tap the glowing moles, dodge the bombs, chain 8 whacks to raise your combo to x5. Golden moles pay 5x.">
<script data-goatcounter="https://raymartin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
html,body{overflow:hidden;position:fixed;width:100%;overscroll-behavior:none}
html,body{height:100%;margin:0;padding:0;background:#0b1026;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'Segoe UI',system-ui,sans-serif}
#c{position:fixed;inset:0;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* Neon Whack — Day 31. Whack-a-mole: 60 seconds, 3x3 holes.
   Moles pop up; tap one to whack it. Normal +100 x combo; golden pays 5x.
   Every 8 chained whacks raises the combo ladder x1->x5. Tapping a bomb
   mole costs a heart and resets the combo. 3 hearts. A flawless run
   (no bomb taps) when the clock ends earns +500. Best score persisted. */
if (typeof document !== "undefined") {
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
}

var NeonWhackLogic = (function () {
  function makeRng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }
  function comboFor(streak) {
    var c = 1 + Math.floor(streak / 8);
    return c > 5 ? 5 : c;
  }
  function scoreFor(combo, golden) { return 100 * combo * (golden ? 5 : 1); }
  // Mole type roll: 12% golden, 16% bomb, rest normal.
  function rollType(r) {
    if (r < 0.12) return "golden";
    if (r < 0.28) return "bomb";
    return "normal";
  }
  // 3x3 hole centers for a board area (x,y,w,h) with padding.
  function holeCenters(W, H) {
    var bw = Math.min(W - 40, 420), bh = Math.min(H * 0.55, 420);
    var x0 = (W - bw) / 2, y0 = H * 0.30;
    var pts = [];
    for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++)
      pts.push({ x: x0 + bw * (c + 0.5) / 3, y: y0 + bh * (r + 0.5) / 3 });
    return pts;
  }
  function holeRadius(W) {
    var r = Math.min(W - 40, 420) / 6 * 0.78;
    return r < 26 ? 26 : (r > 52 ? 52 : r);
  }
  // Spawn: pick a free hole; returns mole or null if all busy.
  function spawnMole(holes, busy, rng, now) {
    var free = [];
    for (var i = 0; i < holes.length; i++) if (!busy[i]) free.push(i);
    if (!free.length) return null;
    var idx = free[Math.floor(rng() * free.length)];
    var type = rollType(rng());
    return { hole: idx, type: type, born: now, ttl: 1050 + rng() * 350,
      up: 0, hit: false };
  }
  // One tap: first up-mole whose circle contains (x,y) wins; at most one.
  function whackAt(moles, holes, radius, x, y) {
    for (var i = 0; i < moles.length; i++) {
      var m = moles[i];
      if (m.hit || m.up < 1) continue;
      var h = holes[m.hole];
      var dx = x - h.x, dy = y - h.y;
      if (dx * dx + dy * dy <= radius * radius) return m;
    }
    return null;
  }
  function spawnInterval(elapsed) {
    // 700ms at start, ramping to 450ms by 60s.
    var t = 700 - elapsed * 250 / 60;
    return t < 450 ? 450 : t;
  }
  return { makeRng: makeRng, comboFor: comboFor, scoreFor: scoreFor,
    rollType: rollType, holeCenters: holeCenters, holeRadius: holeRadius,
    spawnMole: spawnMole, whackAt: whackAt, spawnInterval: spawnInterval };
})();
if (typeof window !== "undefined") { window.NeonWhackLogic = NeonWhackLogic; }

(function () {
  if (typeof document === "undefined") return;
  var canvas = document.getElementById("c");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, dpr = 1;
  // CANVAS SIZING: explicit CSS size = viewport, bitmap = CSS x DPR (capped 2).
  // Bound to resize + orientationchange; transform re-applied every frame.
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = vw; H = vh;
    canvas.style.width = vw + "px";
    canvas.style.height = vh + "px";
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);
  resize();

  var state = "title"; // title | play | over
  var score = 0, streak = 0, combo = 1, hearts = 3, timeLeft = 60, best = 0;
  var bombHits = 0, whacks = 0, floaters = [], moles = [];
  var spawnTimer = 0, elapsed = 0, lastT = 0, rng = Math.random;
  try { best = parseInt(window.localStorage.getItem("neon_whack_best") || "0", 10) || 0; } catch (e) { best = 0; }

  var audio = null;
  function beep(f, d, type) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type || "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.08, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d);
      o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + d);
    } catch (e) {}
  }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  function start() {
    state = "play"; score = 0; streak = 0; combo = 1; hearts = 3;
    timeLeft = 60; bombHits = 0; whacks = 0; moles = []; floaters = [];
    spawnTimer = 0.3; elapsed = 0; lastT = performance.now();
  }
  function endGame(flawlessBonus) {
    state = "over";
    if (flawlessBonus) score += 500;
    if (score > best) { best = score; try { localStorage.setItem("neon_whack_best", String(best)); } catch (e) {} }
  }
  function onTap(x, y) {
    if (state === "title") { start(); beep(660, 0.12); return; }
    if (state === "over") { state = "title"; return; }
    var holes = NeonWhackLogic.holeCenters(W, H);
    var r = NeonWhackLogic.holeRadius(W);
    var m = NeonWhackLogic.whackAt(moles, holes, r, x, y);
    if (!m) return;
    m.hit = true; whacks++;
    if (m.type === "bomb") {
      hearts--; bombHits++; streak = 0; combo = 1; score = Math.max(0, score - 50);
      floaters.push({ x: holes[m.hole].x, y: holes[m.hole].y - 40, txt: "-50 BOMB!", col: "#ff4d6d", t: 1 });
      beep(140, 0.25, "sawtooth"); buzz(120);
      if (hearts <= 0) endGame(false);
    } else {
      var golden = m.type === "golden";
      var pts = NeonWhackLogic.scoreFor(combo, golden);
      score += pts; streak++;
      combo = NeonWhackLogic.comboFor(streak);
      floaters.push({ x: holes[m.hole].x, y: holes[m.hole].y - 40,
        txt: "+" + pts + (golden ? " GOLD!" : ""), col: golden ? "#ffd166" : "#6cf0ff", t: 1 });
      beep(golden ? 1320 : 880, 0.1); buzz(20);
    }
  }
  canvas.addEventListener("pointerdown", function (e) {
    var rect = canvas.getBoundingClientRect();
    onTap(e.clientX - rect.left, e.clientY - rect.top);
  });
  window.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter") { if (state !== "play") onTap(W / 2, H / 2); }
  });

  // Debug snapshot for automated phone checks (one tap -> exactly one whack).
  if (typeof window !== "undefined") {
    window.NeonWhackDebug = { snapshot: function () {
      var holes = NeonWhackLogic.holeCenters(W, H);
      return { state: state, score: score, streak: streak, combo: combo,
        whacks: whacks, hearts: hearts, timeLeft: timeLeft,
        moles: moles.filter(function (m) { return !m.hit && m.up >= 1; }).map(function (m) {
          return { hole: m.hole, type: m.type, x: holes[m.hole].x, y: holes[m.hole].y };
        }) };
    } };
  }

  function drawMole(x, y, r, type, up) {
    var h = r * 1.15 * up;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#101736"; ctx.fill();
    if (up > 0.05) {
      var body = type === "bomb" ? "#ff4d6d" : (type === "golden" ? "#ffd166" : "#6cf0ff");
      ctx.beginPath(); ctx.ellipse(x, y - h * 0.55, r * 0.82, h * 0.62, 0, 0, Math.PI * 2);
      ctx.fillStyle = body; ctx.fill();
      ctx.beginPath(); ctx.arc(x - r * 0.28, y - h * 0.72, r * 0.13, 0, Math.PI * 2);
      ctx.arc(x + r * 0.28, y - h * 0.72, r * 0.13, 0, Math.PI * 2);
      ctx.fillStyle = "#0b1026"; ctx.fill();
      if (type === "bomb") {
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath();
        ctx.moveTo(x, y - h * 1.15); ctx.quadraticCurveTo(x + 8, y - h * 1.4, x + 14, y - h * 1.35); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function frame(now) {
    // World transform re-applied at the start of every frame.
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#0b1026"; ctx.fillRect(0, 0, W, H);
    var dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0.016;
    lastT = now;
    if (state === "play") {
      elapsed += dt; timeLeft = Math.max(0, 60 - elapsed);
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        var busy = []; for (var i = 0; i < 9; i++) busy[i] = false;
        moles.forEach(function (m) { if (!m.hit) busy[m.hole] = true; });
        var nm = NeonWhackLogic.spawnMole(NeonWhackLogic.holeCenters(W, H), busy, rng, now);
        if (nm) moles.push(nm);
        spawnTimer = NeonWhackLogic.spawnInterval(elapsed) / 1000;
      }
      moles = moles.filter(function (m) { return !m.hit && (now - m.born) < m.ttl; });
      moles.forEach(function (m) {
        var age = now - m.born;
        m.up = age < 150 ? age / 150 : (age > m.ttl - 150 ? Math.max(0, (m.ttl - age) / 150) : 1);
      });
      if (timeLeft <= 0) endGame(bombHits === 0);
    }
    // HUD
    ctx.fillStyle = "#e8ecff"; ctx.textAlign = "left"; ctx.font = "bold 20px system-ui";
    ctx.fillText("SCORE " + score, 16, 30);
    ctx.textAlign = "center";
    ctx.fillStyle = combo >= 5 ? "#ffd166" : "#aab4e8";
    ctx.fillText("x" + combo, W / 2, 30);
    ctx.textAlign = "right"; ctx.fillStyle = "#e8ecff";
    ctx.fillText(Math.ceil(timeLeft) + "s", W - 16, 30);
    ctx.textAlign = "left";
    ctx.fillStyle = "#ff4d6d"; ctx.font = "bold 20px system-ui";
    var heartTxt = ""; for (var hi = 0; hi < hearts; hi++) heartTxt += "♥";
    ctx.fillText(heartTxt, 16, 58);
    // Board
    var holes = NeonWhackLogic.holeCenters(W, H);
    var r = NeonWhackLogic.holeRadius(W);
    moles.forEach(function (m) {
      var h = holes[m.hole]; drawMole(h.x, h.y, r, m.type, m.up);
    });
    // Empty holes (drawn under moles already on board: draw rims)
    ctx.strokeStyle = "#2b3572"; ctx.lineWidth = 2;
    holes.forEach(function (h) {
      ctx.beginPath(); ctx.ellipse(h.x, h.y, r, r * 0.42, 0, 0, Math.PI * 2); ctx.stroke();
    });
    floaters = floaters.filter(function (f) { return f.t > 0; });
    floaters.forEach(function (f) {
      ctx.globalAlpha = Math.max(0, f.t); ctx.fillStyle = f.col;
      ctx.font = "bold 22px system-ui"; ctx.textAlign = "center";
      ctx.fillText(f.txt, f.x, f.y); ctx.globalAlpha = 1; f.t -= dt * 0.9; f.y -= dt * 30;
    });
    if (state === "title") {
      ctx.fillStyle = "rgba(4,8,20,0.55)"; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center"; ctx.fillStyle = "#6cf0ff";
      ctx.font = "bold " + Math.min(64, W * 0.13) + "px system-ui";
      ctx.fillText("NEON WHACK", W / 2, H * 0.22);
      ctx.fillStyle = "#e8ecff"; ctx.font = "18px system-ui";
      ctx.fillText("Tap the moles — dodge the bombs!", W / 2, H * 0.22 + 34);
      ctx.fillStyle = "#ffd166"; ctx.font = "bold 24px system-ui";
      ctx.fillText("TAP TO START", W / 2, H * 0.82);
      ctx.fillStyle = "#aab4e8"; ctx.font = "15px system-ui";
      ctx.fillText("Best: " + best + "  ·  Golden moles pay 5x", W / 2, H * 0.82 + 30);
    }
    if (state === "over") {
      ctx.fillStyle = "rgba(4,8,20,0.6)"; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center"; ctx.fillStyle = "#6cf0ff";
      ctx.font = "bold 44px system-ui"; ctx.fillText("TIME!", W / 2, H * 0.35);
      ctx.fillStyle = "#e8ecff"; ctx.font = "bold 30px system-ui";
      ctx.fillText("Score: " + score, W / 2, H * 0.35 + 44);
      ctx.font = "18px system-ui"; ctx.fillStyle = "#aab4e8";
      ctx.fillText("Best: " + best + (bombHits === 0 ? "  ·  Flawless +500!" : ""), W / 2, H * 0.35 + 74);
      ctx.fillStyle = "#ffd166"; ctx.font = "bold 22px system-ui";
      ctx.fillText("TAP TO PLAY AGAIN", W / 2, H * 0.62);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
