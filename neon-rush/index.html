<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Rush — Daily Game</title>
<meta name="description" content="Neon Rush: a 60-second neon arcade racer. Weave through highway traffic, grab coins, chain near-miss combos up to x5. Free daily browser game.">
<script data-goatcounter="https://raymartin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;position:fixed;width:100%;overscroll-behavior:none;}
  body{background:#0b1026;color:#e8ecff;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
    padding:8px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:relative;width:min(96vw,52vh,460px)}
  canvas{width:100%;height:auto;display:block;border-radius:16px;
    box-shadow:0 0 40px rgba(255,60,180,.22),0 8px 30px rgba(0,0,0,.5);touch-action:none}
  #mute{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px;
    border:1px solid #2b3572;background:rgba(21,28,63,.85);color:#e8ecff;font-size:18px;cursor:pointer}
  .credit{margin-top:8px;font-size:11px;color:#555fa0;text-align:center}
  .credit a{color:#7780b8}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="800"></canvas><button id="mute" aria-label="mute">&#128266;</button></div>
<p class="credit">Neon Rush · Day 16 of the daily game dare · free forever</p>
<script>
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
'use strict';
/* Neon Rush — 60-second neon highway racer (Day 16).
 * Pure game logic lives on window.NR so it can be unit-tested headless;
 * rendering/input/audio are thin layers below it. */
window.NR = (function(){
  var W = 480, H = 800;
  var ROAD_L = 60, ROAD_R = 420, LANE_W = 90;
  var LANES = [105, 195, 285, 375];
  var GAME_LEN = 60, PLAYER_Y = 664, PW = 54, PH = 86;
  var CAR_COLORS = ['#ff5d7e','#4fa3ff','#b18cff','#ff9f43','#4de3e3'];
  var onEvent = null; // render-layer hook: onEvent('coin'|'crash'|'nearmiss'|'end')

  function makeRng(seed){
    var s = (seed == null ? (Date.now() & 0xffffffff) : seed) >>> 0;
    return function(){
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(a, rng){
    for (var i = a.length - 1; i > 0; i--){
      var j = (rng() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }

  function createState(rng){
    return {
      rng: rng || makeRng(),
      t: 0, timeLeft: GAME_LEN, score: 0, mult: 1, streak: 0,
      hearts: 3, over: false, win: false, bonusGiven: false,
      started: false, dist: 0,
      player: { x: LANES[1], y: PLAYER_Y, w: PW, h: PH },
      traffic: [], coins: [], popups: [],
      spawnT: 0.6, coinT: 1.0, invuln: 0, shake: 0
    };
  }
  function progress(st){ return 1 - st.timeLeft / GAME_LEN; }
  function trafficSpeed(st){ return 260 + 340 * progress(st); } // 260 -> 600 px/s
  function spawnInterval(st){ return 0.95 - 0.45 * progress(st); } // 0.95s -> 0.5s
  function secondCarP(st){ return 0.15 + 0.45 * progress(st); } // 0.15 -> 0.6

  // Spawn 1-2 cars in free lanes. Lanes with a car still near the top are
  // excluded so a wave can never wall off the whole road. Returns cars spawned.
  function spawnWave(st){
    var rng = st.rng, i, k;
    var blocked = {};
    for (i = 0; i < st.traffic.length; i++){
      var oc = st.traffic[i];
      if (oc.y < 180) blocked[oc.lane] = 1;
    }
    var lanes = shuffle([0,1,2,3], rng);
    var free = [];
    for (k = 0; k < 4; k++) if (!blocked[lanes[k]]) free.push(lanes[k]);
    if (free.length === 0) return 0;
    var n = 1 + ((rng() < secondCarP(st) && free.length > 1) ? 1 : 0);
    var spd = trafficSpeed(st);
    for (var m = 0; m < n; m++){
      var lane = free[m];
      st.traffic.push({
        lane: lane, x: LANES[lane], y: -110, w: PW, h: PH,
        speed: spd * (0.9 + rng() * 0.25),
        color: CAR_COLORS[(rng() * CAR_COLORS.length) | 0],
        counted: false, dead: false
      });
    }
    return n;
  }
  function spawnCoin(st){
    var rng = st.rng, lane = (rng() * 4) | 0;
    st.coins.push({ x: LANES[lane], y: -40, r: 16, spin: rng() * 6.28, dead: false });
  }
  function overlap(ax, ay, aw, ah, bx, by, bw, bh, shrink){
    var s = shrink || 1;
    return Math.abs(ax - bx) * 2 < (aw + bw) * s &&
           Math.abs(ay - by) * 2 < (ah + bh) * s;
  }
  function addScore(st, base, label, x, y){
    var pts = base * st.mult;
    st.score += pts;
    st.streak++;
    if (st.streak % 8 === 0 && st.mult < 5) st.mult++;
    st.popups.push({ x: x, y: y, text: '+' + pts + (label ? ' ' + label : ''), t: 0, life: 0.9, big: 0 });
    return pts;
  }
  function crash(st){
    st.hearts--; st.streak = 0; st.mult = 1; st.invuln = 2; st.shake = 0.35;
    st.popups.push({ x: st.player.x, y: st.player.y - 80, text: 'CRASH!', t: 0, life: 1.1, big: 1 });
    if (st.hearts <= 0){ st.over = true; st.win = false; }
  }
  function endGame(st){
    st.over = true;
    if (st.hearts > 0){
      st.win = (st.hearts === 3);
      if (st.win && !st.bonusGiven){ st.score += 500; st.bonusGiven = true; }
    }
  }
  // Pure autoplay helper: returns the lane-center x the AI should steer to.
  function autoTargetX(st){
    var best = LANES[0], bestScore = Infinity, li, i, j;
    for (li = 0; li < 4; li++){
      var x = LANES[li], danger = 0, attract = 0;
      for (i = 0; i < st.traffic.length; i++){
        var c = st.traffic[i];
        var gap = st.player.y - c.y;
        if (gap < -60) continue; // already behind the player
        danger += (1 / (1 + Math.max(0, gap) / 130)) * (1 / (1 + Math.abs(c.x - x) / 70));
      }
      for (j = 0; j < st.coins.length; j++){
        var cn = st.coins[j];
        var gap2 = st.player.y - cn.y;
        if (gap2 < -40 || gap2 > 600) continue;
        attract -= (0.9 / (1 + gap2 / 220)) * (1 - Math.min(1, Math.abs(cn.x - x) / 260));
      }
      var s2 = danger * 3 + attract;
      if (s2 < bestScore){ bestScore = s2; best = x; }
    }
    return best;
  }
  function update(st, dt, input){
    input = input || {};
    if (st.over || !st.started) return;
    if (dt > 0.05) dt = 0.05;
    if (dt <= 0) return;
    st.t += dt;
    st.timeLeft -= dt;
    var spd = trafficSpeed(st);
    st.dist += spd * dt;
    st.score += dt * 5; // survival trickle
    if (st.invuln > 0) st.invuln -= dt;
    if (st.shake > 0) st.shake -= dt;

    // --- player movement ---
    var p = st.player;
    if (input.pointerX != null){
      var dx = input.pointerX - p.x, maxStep = 760 * dt;
      p.x += clamp(dx, -maxStep, maxStep);
    } else if (input.dir){
      p.x += input.dir * 430 * dt;
    }
    p.x = clamp(p.x, ROAD_L + PW / 2 + 4, ROAD_R - PW / 2 - 4);

    // --- spawns ---
    st.spawnT -= dt;
    if (st.spawnT <= 0){ spawnWave(st); st.spawnT = spawnInterval(st); }
    st.coinT -= dt;
    if (st.coinT <= 0){ spawnCoin(st); st.coinT = 1.1 + st.rng() * 0.7; }

    // --- traffic ---
    var i, c;
    for (i = st.traffic.length - 1; i >= 0; i--){
      c = st.traffic[i];
      c.y += c.speed * dt;
      if (c.y > H + 140){ st.traffic.splice(i, 1); continue; }
      if (!c.counted && !c.dead && c.y - c.h / 2 > p.y + p.h / 2){
        c.counted = true;
        if (Math.abs(c.x - p.x) < 115){
          addScore(st, 25, 'NEAR MISS', p.x, p.y - 95);
          if (onEvent) onEvent('nearmiss');
        }
      }
      if (!c.dead && st.invuln <= 0 &&
          overlap(p.x, p.y, p.w, p.h, c.x, c.y, c.w, c.h, 0.78)){
        c.dead = true;
        crash(st);
        if (onEvent) onEvent('crash');
      }
    }

    // --- coins ---
    for (i = st.coins.length - 1; i >= 0; i--){
      var cn = st.coins[i];
      cn.y += spd * 0.85 * dt;
      cn.spin += dt * 6;
      if (cn.y > H + 60){ st.coins.splice(i, 1); continue; }
      if (overlap(p.x, p.y, p.w, p.h, cn.x, cn.y, cn.r * 2, cn.r * 2, 0.9)){
        st.coins.splice(i, 1);
        addScore(st, 50, '', cn.x, cn.y - 24);
        if (onEvent) onEvent('coin');
      }
    }

    // --- popups ---
    for (i = st.popups.length - 1; i >= 0; i--){
      var pp = st.popups[i];
      pp.t += dt;
      if (pp.t > pp.life) st.popups.splice(i, 1);
    }

    if (st.timeLeft <= 0 && !st.over){
      st.timeLeft = 0;
      endGame(st);
      if (onEvent) onEvent('end');
    }
  }

  return {
    W: W, H: H, LANES: LANES, GAME_LEN: GAME_LEN, PLAYER_Y: PLAYER_Y,
    makeRng: makeRng, createState: createState,
    trafficSpeed: trafficSpeed, spawnInterval: spawnInterval, secondCarP: secondCarP,
    spawnWave: spawnWave, spawnCoin: spawnCoin,
    overlap: overlap, addScore: addScore, crash: crash, endGame: endGame,
    autoTargetX: autoTargetX, update: update,
    setEventHook: function(fn){ onEvent = fn; }
  };
})();

/* ================= rendering / input / audio (thin layer) ================= */
(function(){
  var NR = window.NR;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = NR.W, H = NR.H;
  var AUTO = /[?&]auto=1/.test(location.search || '');
  var store = { best: 0 };
  try {
    store.best = parseInt(localStorage.getItem('nr_best') || '0', 10) || 0;
  } catch (e) {}

  // ---- audio ----
  var actx = null, masterGain = null, muted = false;
  try { muted = localStorage.getItem('nr_mute') === '1'; } catch (e) {}
  var muteBtn = document.getElementById('mute');
  function paintMute(){ muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;'; }
  paintMute();
  function ac(){
    if (!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      masterGain = actx.createGain();
      masterGain.gain.value = 0.35;
      masterGain.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function beep(freq, dur, type, vol, slideTo){
    if (muted) return;
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.5, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g); g.connect(masterGain);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }
  function buzz(pat){
    try { if (!muted && navigator.vibrate) navigator.vibrate(pat); } catch (e) {}
  }
  NR.setEventHook(function(ev){
    if (ev === 'coin'){ beep(880, 0.09, 'square', 0.25); beep(1320, 0.12, 'square', 0.2); buzz(12); }
    else if (ev === 'nearmiss'){ beep(420, 0.14, 'sawtooth', 0.18, 900); }
    else if (ev === 'crash'){ beep(160, 0.3, 'sawtooth', 0.5, 50); buzz([70, 40, 70]); }
    else if (ev === 'end'){ beep(523, 0.12, 'triangle', 0.4); setTimeout(function(){ beep(659, 0.12, 'triangle', 0.4); }, 130); setTimeout(function(){ beep(784, 0.22, 'triangle', 0.4); }, 260); }
  });
  muteBtn.addEventListener('click', function(ev){
    ev.stopPropagation();
    muted = !muted;
    try { localStorage.setItem('nr_mute', muted ? '1' : '0'); } catch (e) {}
    paintMute();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'm' || e.key === 'M') muteBtn.click();
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if ((e.key === ' ' || e.key === 'Enter') && !state.started) startGame();
    else if ((e.key === ' ' || e.key === 'Enter') && state.over) startGame();
  });
  document.addEventListener('keyup', function(e){
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });
  var keys = { left: false, right: false };

  // ---- state & input ----
  var state = NR.createState();
  var pointerX = null, pointerDown = false;
  function canvasX(clientX){
    var r = canvas.getBoundingClientRect();
    return (clientX - r.left) * (W / r.width);
  }
  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault();
    ac();
    if (!state.started || state.over){ startGame(); return; }
    pointerDown = true;
    pointerX = canvasX(e.clientX);
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function(e){
    if (pointerDown) pointerX = canvasX(e.clientX);
  });
  function releasePointer(){ pointerDown = false; pointerX = null; }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  function startGame(){
    var keepBest = store.best;
    state = NR.createState();
    state.started = true;
    store.best = keepBest;
    releasePointer();
    beep(660, 0.1, 'triangle', 0.4);
  }
  if (AUTO){ state.started = true; }

  // ---- drawing ----
  function rr(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawCar(x, y, w, h, color, isPlayer, t){
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.fillStyle = color;
    rr(x - w / 2, y - h / 2, w, h, 10);
    ctx.fill();
    ctx.shadowBlur = 0;
    // windshield + roof
    ctx.fillStyle = 'rgba(10,14,40,0.85)';
    rr(x - w / 2 + 7, y - h / 2 + 12, w - 14, h * 0.30, 6);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    rr(x - w / 2 + 7, y - h / 2 + 12, w - 14, h * 0.12, 6);
    ctx.fill();
    // headlights / taillights
    ctx.fillStyle = isPlayer ? '#fff7c0' : '#ffd93d';
    ctx.fillRect(x - w / 2 + 5, y - h / 2 - 3, 10, 4);
    ctx.fillRect(x + w / 2 - 15, y - h / 2 - 3, 10, 4);
    ctx.fillStyle = '#ff2d55';
    ctx.fillRect(x - w / 2 + 5, y + h / 2 - 1, 10, 4);
    ctx.fillRect(x + w / 2 - 15, y + h / 2 - 1, 10, 4);
    // wheels
    ctx.fillStyle = '#05070f';
    var ww = 8, wh = 18;
    ctx.fillRect(x - w / 2 - 3, y - h / 4 - wh / 2, ww, wh);
    ctx.fillRect(x + w / 2 - 5, y - h / 4 - wh / 2, ww, wh);
    ctx.fillRect(x - w / 2 - 3, y + h / 4 - wh / 2, ww, wh);
    ctx.fillRect(x + w / 2 - 5, y + h / 4 - wh / 2, ww, wh);
    ctx.restore();
  }
  function drawRoad(){
    ctx.fillStyle = '#0b1026';
    ctx.fillRect(0, 0, W, H);
    // road bed
    ctx.fillStyle = '#141a3d';
    ctx.fillRect(60, 0, 360, H);
    // neon edges
    ctx.save();
    ctx.shadowColor = '#22e6ff'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#22e6ff';
    ctx.fillRect(56, 0, 4, H);
    ctx.shadowColor = '#ff3df0';
    ctx.fillStyle = '#ff3df0';
    ctx.fillRect(420, 0, 4, H);
    ctx.restore();
    // lane dashes scroll with distance
    ctx.fillStyle = 'rgba(200,215,255,0.35)';
    var dashH = 34, gap = 46, off = state.dist % (dashH + gap);
    for (var l = 1; l < 4; l++){
      var x = 60 + l * 90;
      for (var y = -dashH + off; y < H + dashH; y += dashH + gap){
        ctx.fillRect(x - 2, y - H % 1, 4, dashH);
      }
    }
  }
  function drawCoin(cn){
    var sq = Math.abs(Math.cos(cn.spin));
    ctx.save();
    ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffd93d';
    ctx.beginPath();
    ctx.ellipse(cn.x, cn.y, cn.r * (0.35 + 0.65 * sq), cn.r, 0, 0, 6.2832);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#a86e00';
    ctx.beginPath();
    ctx.ellipse(cn.x, cn.y, cn.r * 0.45 * (0.35 + 0.65 * sq), cn.r * 0.45, 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }
  function drawHUD(){
    ctx.save();
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#e8ecff';
    ctx.font = '700 26px system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(Math.floor(state.score), 14, 12);
    ctx.textAlign = 'center';
    var t = Math.ceil(state.timeLeft);
    ctx.fillStyle = t <= 10 ? '#ff5d7e' : '#e8ecff';
    ctx.font = '800 34px system-ui,sans-serif';
    ctx.fillText(t + 's', W / 2, 8);
    // hearts (below the mute button, which sits top-right)
    ctx.textAlign = 'right';
    ctx.font = '24px system-ui,sans-serif';
    var hs = '';
    for (var i = 0; i < 3; i++) hs += i < state.hearts ? '❤' : '🖤';
    ctx.fillText(hs, W - 14, 54);
    // combo badge
    if (state.mult > 1){
      ctx.textAlign = 'left';
      ctx.font = '800 24px system-ui,sans-serif';
      ctx.fillStyle = '#ffd93d';
      ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 10;
      ctx.fillText('x' + state.mult, 14, 44);
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
  function drawPopups(){
    ctx.save();
    ctx.textAlign = 'center';
    for (var i = 0; i < state.popups.length; i++){
      var pp = state.popups[i], k = pp.t / pp.life;
      ctx.globalAlpha = 1 - k;
      ctx.font = pp.big ? '800 40px system-ui,sans-serif' : '700 20px system-ui,sans-serif';
      ctx.fillStyle = pp.big ? '#ff5d7e' : '#7dffc8';
      if (pp.big){ ctx.shadowColor = '#ff5d7e'; ctx.shadowBlur = 16; }
      ctx.fillText(pp.text, pp.x, pp.y - k * 46);
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
  function centerText(lines, y0){
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (var i = 0; i < lines.length; i++){
      var L = lines[i];
      ctx.font = L.font;
      ctx.fillStyle = L.color;
      if (L.glow){ ctx.shadowColor = L.glow; ctx.shadowBlur = 18; } else ctx.shadowBlur = 0;
      ctx.fillText(L.text, W / 2, y0 + i * L.dy);
    }
    ctx.restore();
  }
  function drawTitle(){
    ctx.save();
    ctx.fillStyle = 'rgba(5,8,25,0.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    centerText([
      { text: 'NEON RUSH', font: '900 64px system-ui,sans-serif', color: '#22e6ff', glow: '#22e6ff', dy: 70 },
      { text: '60-second highway racer', font: '600 20px system-ui,sans-serif', color: '#aab4e8', dy: 44 },
      { text: 'Dodge traffic · grab coins', font: '500 17px system-ui,sans-serif', color: '#7780b8', dy: 36 },
      { text: 'Near misses chain combos to x5', font: '500 17px system-ui,sans-serif', color: '#7780b8', dy: 36 },
      { text: 'Drag or arrow keys to steer', font: '500 17px system-ui,sans-serif', color: '#7780b8', dy: 36 },
      { text: store.best > 0 ? ('BEST  ' + store.best) : '', font: '700 20px system-ui,sans-serif', color: '#ffd93d', dy: 52 },
      { text: '— TAP TO START —', font: '800 24px system-ui,sans-serif', color: '#7dffc8', glow: '#7dffc8', dy: 64 }
    ], 210);
  }
  function drawGameOver(){
    ctx.save();
    ctx.fillStyle = 'rgba(5,8,25,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    var sc = Math.floor(state.score);
    var lines = [
      { text: state.win ? 'FLAWLESS!' : 'TIME UP', font: '900 56px system-ui,sans-serif', color: state.win ? '#ffd93d' : '#22e6ff', glow: state.win ? '#ffd93d' : '#22e6ff', dy: 66 },
      { text: 'SCORE  ' + sc, font: '800 34px system-ui,sans-serif', color: '#e8ecff', dy: 52 }
    ];
    if (state.win) lines.push({ text: '+500 no-crash bonus', font: '600 18px system-ui,sans-serif', color: '#7dffc8', dy: 34 });
    if (sc > store.best) lines.push({ text: 'NEW BEST!', font: '800 22px system-ui,sans-serif', color: '#ff8cd1', glow: '#ff8cd1', dy: 40 });
    else lines.push({ text: 'BEST  ' + store.best, font: '600 18px system-ui,sans-serif', color: '#7780b8', dy: 40 });
    lines.push({ text: '— TAP TO RACE AGAIN —', font: '800 22px system-ui,sans-serif', color: '#7dffc8', dy: 60 });
    centerText(lines, 250);
  }
  function draw(){
    ctx.save();
    if (state.shake > 0){
      var s = state.shake * 22;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }
    drawRoad();
    var i, blink = state.invuln > 0 && ((state.t * 10) | 0) % 2 === 0;
    for (i = 0; i < state.coins.length; i++) drawCoin(state.coins[i]);
    for (i = 0; i < state.traffic.length; i++){
      var c = state.traffic[i];
      if (!c.dead) drawCar(c.x, c.y, c.w, c.h, c.color, false, state.t);
    }
    if (!blink) drawCar(state.player.x, state.player.y, state.player.w, state.player.h, '#43e08a', true, state.t);
    drawPopups();
    ctx.restore();
    if (state.started && !state.over) drawHUD();
    if (!state.started) drawTitle();
    if (state.over){
      var sc = Math.floor(state.score);
      if (sc > store.best){
        store.best = sc;
        try { localStorage.setItem('nr_best', String(sc)); } catch (e) {}
      }
      drawGameOver();
    }
  }

  // ---- main loop ----
  var last = 0, hiddenPause = false;
  document.addEventListener('visibilitychange', function(){ hiddenPause = document.hidden; });
  function frame(ts){
    requestAnimationFrame(frame);
    if (hiddenPause){ last = ts; return; }
    var dt = last ? (ts - last) / 1000 : 0.016;
    last = ts;
    if (state.started && !state.over){
      var input = {};
      if (AUTO) input.pointerX = NR.autoTargetX(state);
      else {
        if (pointerX != null) input.pointerX = pointerX;
        else if (keys.left && !keys.right) input.dir = -1;
        else if (keys.right && !keys.left) input.dir = 1;
      }
      NR.update(state, dt, input);
    }
    draw();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
