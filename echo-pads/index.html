<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Stack — Daily Game</title>
<meta name="description" content="Neon Stack: a 60-second precision stacker. Tap to drop the sliding block — slice the overhang, chain perfect drops up to x5, grab golden blocks. Free daily browser game.">
<script data-goatcounter="https://raymartin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#070a1c; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; touch-action:none; user-select:none; -webkit-user-select:none;position:fixed;width:100%;overscroll-behavior:none;}
  #wrap { position:relative; }
  canvas { display:block; border-radius:12px; box-shadow:0 0 60px rgba(80,120,255,.25); background:#0a0e27; }
  #muteBtn { position:absolute; bottom:10px; right:10px; width:40px; height:40px; border-radius:50%;
    background:rgba(20,28,70,.85); border:1px solid #3b4a9e; color:#cfe0ff; font-size:18px; cursor:pointer; z-index:5; }
  #muteBtn:active { transform:scale(.92); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="muteBtn" title="Mute (M)">🔊</button>
</div>
<script>
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
(function(){
'use strict';
/* ================= Neon Stack — Day 20 (Stacker) ================= */
var W = 480, H = 800, BH = 28;            // logical size, block height
var GAME_LEN = 60, START_W = 220, BASE_W = 260;
var PERFECT_RATIO = 0.96, MIN_W = 16, MAX_COMBO = 5;

var NS = {};
if (typeof window !== 'undefined') window.NS = NS;

/* ---------- pure logic (testable, DOM-free) ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function overlap(ax, aw, bx, bw){
  var l = Math.max(ax, bx), r = Math.min(ax+aw, bx+bw);
  return Math.max(0, r-l);
}
NS.overlap = overlap;

function classifyDrop(curW, ov){
  if (ov <= 0) return 'miss';
  if (ov / curW >= PERFECT_RATIO) return 'perfect';
  return 'slice';
}
NS.classifyDrop = classifyDrop;

function pointsFor(kind, gold, combo){
  var base = (kind === 'perfect') ? 50 : 25;
  if (gold) base *= 5;
  return base * combo;
}
NS.pointsFor = pointsFor;

function speedFor(tLeft){           // block slide speed ramps over the minute
  return 200 + (1 - tLeft/GAME_LEN) * 360;
}
NS.speedFor = speedFor;

function stepMove(x, dir, w, dt){
  x += dir * dt;
  if (x <= 0){ x = 0; dir = 1; }
  else if (x + w >= W){ x = W - w; dir = -1; }
  return { x:x, dir:dir };
}
NS.stepMove = stepMove;

function nextCombo(combo, perfectStreak){
  if (perfectStreak > 0 && perfectStreak % 4 === 0 && combo < MAX_COMBO) return combo+1;
  return combo;
}
NS.nextCombo = nextCombo;

function createState(){
  return {
    mode:'start', t:GAME_LEN, score:0, combo:1, perfectStreak:0, hearts:3,
    blocks:[{x:(W-BASE_W)/2, w:BASE_W, hue:190, gold:false}],
    cur:null, spawnCount:0,
    slices:[], popups:[],
    camShift:0, elapsed:0, landed:0, perfects:0, misses:0,
    best:0, muted:false, paused:false, overReason:''
  };
}
NS.createState = createState;
NS.GAME_LEN = GAME_LEN; NS.MAX_COMBO = MAX_COMBO; NS.PERFECT_RATIO = PERFECT_RATIO;

/* Resolve a drop against the top block. Returns an event object; mutates state. */
function resolveDrop(s){
  var cur = s.cur, top = s.blocks[s.blocks.length-1];
  var ov = overlap(cur.x, cur.w, top.x, top.w);
  var kind = classifyDrop(cur.w, ov);
  var ev = { kind:kind, ov:ov, points:0 };
  if (kind === 'miss'){
    s.hearts--; s.combo = 1; s.perfectStreak = 0; s.misses++;
    s.slices.push({ x:cur.x, w:cur.w, y:-s.blocks.length*BH-110, vy:520, hue:cur.hue, gold:cur.gold });
    ev.points = 0;
  } else {
    var nx, nw;
    if (kind === 'perfect'){ nx = top.x; nw = cur.w; s.perfects++; s.perfectStreak++; }
    else {
      var l = Math.max(cur.x, top.x), r = Math.min(cur.x+cur.w, top.x+top.w);
      nx = l; nw = Math.max(MIN_W, r-l);
      s.perfectStreak = 0;
      var wyTop = -(s.blocks.length+1)*BH; // world y of the dropped block's top
      // overhang slice(s)
      if (cur.x < l) s.slices.push({ x:cur.x, w:l-cur.x, y:wyTop, vy:420, hue:cur.hue, gold:cur.gold });
      if (cur.x+cur.w > r) s.slices.push({ x:r, w:cur.x+cur.w-r, y:wyTop, vy:420, hue:cur.hue, gold:cur.gold });
    }
    ev.points = pointsFor(kind, cur.gold, s.combo);
    s.score += ev.points;
    s.combo = nextCombo(s.combo, s.perfectStreak);
    s.blocks.push({ x:nx, w:nw, hue:cur.hue, gold:cur.gold });
    s.landed++;
  }
  return ev;
}
NS.resolveDrop = resolveDrop;

function spawnBlock(s, rnd){
  rnd = rnd || Math.random;
  var top = s.blocks[s.blocks.length-1];
  var w = (s.blocks.length === 1) ? START_W : Math.max(MIN_W, top.w);
  var hue = (s.spawnCount * 47 + 200) % 360;
  s.cur = {
    x: rnd()*(W-w), w:w, dir: rnd()<0.5?-1:1,
    speed: speedFor(s.t), hue: hue, gold: (s.spawnCount % 7 === 6),
    falling:0, fallFrom:0, born: s.elapsed
  };
  s.spawnCount++;
}
NS.spawnBlock = spawnBlock;

/* ---------- audio (guarded) ---------- */
var AC = null;
function ac(){
  if (AC) return AC;
  try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ AC = null; }
  return AC;
}
function tone(freq, dur, type, vol, slideTo){
  try {
    if (NS._muted()) return;
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(freq, c.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime+dur);
    g.gain.setValueAtTime(vol||0.12, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur+0.02);
  } catch(e){}
}
function sfx(name){
  if (name==='drop') tone(300,0.12,'triangle',0.10,140);
  else if (name==='land') tone(180,0.08,'triangle',0.12);
  else if (name==='perfect'){ tone(880,0.12,'sine',0.12); setTimeout(function(){tone(1320,0.16,'sine',0.12);},70); }
  else if (name==='gold'){ tone(660,0.1,'square',0.08); setTimeout(function(){tone(990,0.14,'square',0.08);},60); }
  else if (name==='miss') tone(140,0.25,'sawtooth',0.12,70);
  else if (name==='over'){ tone(440,0.15,'sine',0.12); setTimeout(function(){tone(330,0.15,'sine',0.12);},140); setTimeout(function(){tone(220,0.3,'sine',0.12);},280); }
  else if (name==='tick') tone(1200,0.05,'sine',0.06);
}
function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }

/* ---------- runtime (DOM) ---------- */
var canvas=null, ctx=null, S=null, dpr=1, rafId=0, lastTs=0;
var AUTO = (typeof location!=='undefined') && /[?&]auto=1/.test(location.search);

function loadBest(){ try { return parseInt(localStorage.getItem('neon-stack-best')||'0',10)||0; } catch(e){ return 0; } }
function saveBest(v){ try { localStorage.setItem('neon-stack-best', String(v)); } catch(e){} }
function loadMute(){ try { return localStorage.getItem('neon-stack-mute')==='1'; } catch(e){ return false; } }
function saveMute(m){ try { localStorage.setItem('neon-stack-mute', m?'1':'0'); } catch(e){} }
NS._muted = function(){ return S ? S.muted : false; };

function fit(){
  dpr = Math.min(2, window.devicePixelRatio||1);
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var sc = Math.min((window.innerWidth-8)/W, (window.innerHeight-8)/H);
  canvas.style.width = (W*sc)+'px'; canvas.style.height = (H*sc)+'px';
}

function blockScreenY(i, shift){
  return H*0.80 - (i+1)*BH + shift;
}

function startGame(){
  var best = S.best, muted = S.muted;
  S = createState(); S.best = best; S.muted = muted;
  S.mode = 'play';
  spawnBlock(S);
  ac(); // unlock audio on gesture
}

function endGame(reason){
  S.mode = 'over'; S.overReason = reason;
  if (reason === 'time' && S.hearts > 0){
    S.score += 500;
    S.popups.push({x:W/2, y:H*0.4, txt:'SURVIVAL +500', ttl:1.6, color:'#7dff9a'});
  }
  if (S.score > S.best){ S.best = S.score; saveBest(S.score); }
  sfx('over'); buzz(120);
}

function doDrop(){
  if (!S || S.mode!=='play' || S.paused || !S.cur || S.cur.falling>0) return;
  sfx('drop');
  S.cur.falling = 0.0001; // start fall animation
  S.cur.fallFrom = laneY();
}

function laneY(){
  var n = S.blocks.length;
  var shift = S.camShift;
  return blockScreenY(n-1, shift) - 110;
}

function update(dt){
  if (S.mode!=='play' || S.paused) return;
  S.elapsed += dt;
  S.t -= dt;
  if (S.t <= 3.2 && S.t + dt > 3.2) sfx('tick');
  if (S.t <= 0){ S.t = 0; endGame('time'); return; }

  var cur = S.cur;
  if (cur && cur.falling <= 0){
    cur.speed = speedFor(S.t);
    var mv = stepMove(cur.x, cur.dir, cur.w, cur.speed*dt);
    cur.x = mv.x; cur.dir = mv.dir;
  } else if (cur){
    cur.falling += dt/0.14;
    if (cur.falling >= 1){
      var ev = resolveDrop(S);
      var topY = blockScreenY(S.blocks.length-1, S.camShift);
      if (ev.kind === 'miss'){
        sfx('miss'); buzz(90);
        S.popups.push({x:W/2, y:topY-60, txt:'MISS!', ttl:1.1, color:'#ff5d7a'});
        if (S.hearts <= 0){ endGame('lives'); return; }
      } else {
        if (ev.kind === 'perfect'){ sfx('perfect'); buzz([25,40]); }
        else { sfx('land'); buzz(12); }
        if (cur.gold) sfx('gold');
        var label = (ev.kind==='perfect' ? 'PERFECT +' : '+') + ev.points + (cur.gold ? ' GOLD' : '');
        S.popups.push({x:W/2, y:topY-60, txt:label, ttl:1.0,
          color: cur.gold ? '#ffd75e' : (ev.kind==='perfect' ? '#7dffd4' : '#cfe0ff')});
        if (S.combo > 1 && ev.kind==='perfect')
          S.popups.push({x:W/2, y:topY-92, txt:'COMBO x'+S.combo, ttl:1.0, color:'#ff9df2'});
      }
      spawnBlock(S);
    }
  }

  // slices fall
  for (var i=S.slices.length-1;i>=0;i--){
    var sl = S.slices[i]; sl.vy += 1400*dt; sl.y += sl.vy*dt;
    if (sl.y > H+80) S.slices.splice(i,1);
  }
  // popups
  for (var j=S.popups.length-1;j>=0;j--){
    S.popups[j].ttl -= dt; S.popups[j].y -= 34*dt;
    if (S.popups[j].ttl<=0) S.popups.splice(j,1);
  }
  // camera: keep stack top above middle
  var want = Math.max(0, S.blocks.length*BH - H*0.42);
  S.camShift += (want - S.camShift) * Math.min(1, dt*5);

  // autoplay demo: aim, don't insta-drop — wait a beat after spawn, then drop near alignment
  if (AUTO && S.cur && S.cur.falling<=0 && (S.elapsed - S.cur.born) > 0.45){
    var top = S.blocks[S.blocks.length-1];
    var dx = (S.cur.x + S.cur.w/2) - (top.x + top.w/2);
    if (Math.abs(dx) < Math.max(12, S.cur.w*0.10) + Math.random()*12) doDrop();
  }
}

function drawBlock(x, y, w, hue, gold){
  ctx.save();
  ctx.shadowBlur = 18;
  ctx.shadowColor = gold ? '#ffd75e' : 'hsla('+hue+',95%,60%,.9)';
  ctx.fillStyle = gold ? '#ffd75e' : 'hsl('+hue+',85%,52%)';
  ctx.fillRect(x, y, w, BH-3);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.fillRect(x, y, w, 5);
  if (gold){
    ctx.fillStyle = 'rgba(120,60,0,.35)';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('★', x+w/2, y+17);
  }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // bg
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0e27'); g.addColorStop(1,'#131a45');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // grid floor glow
  ctx.strokeStyle = 'rgba(90,110,255,.14)'; ctx.lineWidth = 1;
  for (var gx=0; gx<=W; gx+=40){ ctx.beginPath(); ctx.moveTo(gx,H*0.80); ctx.lineTo(gx,H); ctx.stroke(); }

  var shift = S.camShift, n = S.blocks.length;
  // slices (behind blocks): world y -> screen
  for (var i=0;i<S.slices.length;i++){
    var sl=S.slices[i];
    ctx.save(); ctx.globalAlpha = 0.85;
    ctx.fillStyle = sl.gold ? '#ffd75e' : 'hsl('+sl.hue+',85%,52%)';
    ctx.fillRect(sl.x, H*0.80 + sl.y + shift, sl.w, BH-3);
    ctx.restore();
  }
  // stack
  for (var b=0;b<n;b++){
    var blk=S.blocks[b];
    drawBlock(blk.x, blockScreenY(b,shift), blk.w, blk.hue, blk.gold);
  }
  // moving / falling block
  var cur=S.cur;
  if (cur && S.mode==='play'){
    var topY = blockScreenY(n-1, shift) - BH;
    var y;
    if (cur.falling>0){
      var k = Math.min(1, cur.falling);
      y = cur.fallFrom + (topY - cur.fallFrom) * k*k;
    } else y = laneY();
    // guide line
    ctx.save(); ctx.setLineDash([6,6]); ctx.strokeStyle='rgba(160,180,255,.25)';
    ctx.beginPath(); ctx.moveTo(cur.x+cur.w/2, y+BH); ctx.lineTo(cur.x+cur.w/2, topY); ctx.stroke(); ctx.restore();
    drawBlock(cur.x, y, cur.w, cur.hue, cur.gold);
  }

  drawHUD();
  if (S.mode==='start') drawStart();
  if (S.mode==='over') drawOver();
  if (S.paused && S.mode==='play'){
    ctx.fillStyle='rgba(5,8,25,.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.font='bold 30px sans-serif'; ctx.textAlign='center';
    ctx.fillText('PAUSED', W/2, H/2);
  }
}

function drawHUD(){
  ctx.textAlign='left'; ctx.font='bold 17px sans-serif'; ctx.fillStyle='#cfe0ff';
  ctx.fillText('SCORE '+S.score, 14, 30);
  ctx.textAlign='center'; ctx.fillStyle = S.t<=10 ? '#ff7d92' : '#cfe0ff';
  ctx.font='bold 22px sans-serif';
  ctx.fillText(Math.ceil(S.t)+'s', W/2, 32);
  ctx.textAlign='right'; ctx.font='18px sans-serif';
  var hearts=''; for (var h=0;h<3;h++) hearts += h<S.hearts ? '❤' : '🖤';
  ctx.fillText(hearts, W-14, 30);
  if (S.combo>1){
    ctx.textAlign='left'; ctx.fillStyle='#ff9df2'; ctx.font='bold 15px sans-serif';
    ctx.fillText('COMBO x'+S.combo+'  ('+S.perfectStreak+' perfect)', 14, 54);
  }
  // popups
  ctx.textAlign='center';
  for (var i=0;i<S.popups.length;i++){
    var p=S.popups[i];
    ctx.globalAlpha = Math.min(1, p.ttl*2);
    ctx.font='bold 20px sans-serif'; ctx.fillStyle=p.color;
    ctx.fillText(p.txt, p.x, p.y);
    ctx.globalAlpha = 1;
  }
}

function panel(){
  ctx.fillStyle='rgba(8,12,35,.88)';
  ctx.strokeStyle='#3b4a9e'; ctx.lineWidth=2;
  var pw=400, ph=430, px=(W-pw)/2, py=(H-ph)/2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(px,py,pw,ph,18); else ctx.rect(px,py,pw,ph);
  ctx.fill(); ctx.stroke();
  return {px:px, py:py, pw:pw, ph:ph};
}

function drawStart(){
  var p=panel(), cx=W/2;
  ctx.textAlign='center';
  ctx.fillStyle='#7dffd4'; ctx.font='bold 40px sans-serif';
  ctx.fillText('NEON STACK', cx, p.py+70);
  ctx.fillStyle='#aab4e8'; ctx.font='16px sans-serif';
  var lines=['Tap to drop the sliding block.','Overhang gets sliced off!','4 perfect drops in a row → combo up','Gold blocks pay 5x · 3 hearts · 60 seconds'];
  for (var i=0;i<lines.length;i++) ctx.fillText(lines[i], cx, p.py+120+i*30);
  ctx.fillStyle='#7dff9a'; ctx.font='bold 22px sans-serif';
  ctx.fillText(AUTO ? 'AUTO DEMO' : '— TAP TO START —', cx, p.py+300);
  ctx.fillStyle='#7780b8'; ctx.font='15px sans-serif';
  ctx.fillText('Best: '+S.best, cx, p.py+340);
  ctx.fillText('Space / click / tap to drop', cx, p.py+368);
}

function drawOver(){
  var p=panel(), cx=W/2;
  ctx.textAlign='center';
  ctx.fillStyle='#ff8cd1'; ctx.font='bold 38px sans-serif';
  ctx.fillText(S.overReason==='lives' ? 'OUT OF HEARTS' : "TIME'S UP!", cx, p.py+70);
  ctx.fillStyle='#fff'; ctx.font='bold 30px sans-serif';
  ctx.fillText('Score: '+S.score, cx, p.py+130);
  ctx.fillStyle = S.score>=S.best && S.score>0 ? '#ffd75e' : '#aab4e8';
  ctx.font='18px sans-serif';
  ctx.fillText(S.score>=S.best && S.score>0 ? '★ NEW BEST! ★' : 'Best: '+S.best, cx, p.py+168);
  ctx.fillStyle='#aab4e8'; ctx.font='15px sans-serif';
  ctx.fillText('Blocks stacked: '+S.landed+'   Perfect: '+S.perfects+'   Misses: '+S.misses, cx, p.py+210);
  ctx.fillStyle='#7dff9a'; ctx.font='bold 22px sans-serif';
  ctx.fillText('— TAP TO PLAY AGAIN —', cx, p.py+300);
}

function loop(ts){
  rafId = requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts-lastTs)/1000);
  lastTs = ts;
  update(dt);
  draw();
}

function onPress(e){
  if (e) e.preventDefault();
  if (!S) return;
  if (S.mode==='start' || S.mode==='over'){ startGame(); return; }
  doDrop();
}

function init(){
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  S = createState();
  S.best = loadBest(); S.muted = loadMute();
  var btn = document.getElementById('muteBtn');
  btn.textContent = S.muted ? '🔇' : '🔊';
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    S.muted = !S.muted; saveMute(S.muted);
    btn.textContent = S.muted ? '🔇' : '🔊';
  });
  fit();
  window.addEventListener('resize', fit);
  canvas.addEventListener('pointerdown', onPress);
  window.addEventListener('keydown', function(e){
    if (e.code==='Space'){ e.preventDefault(); onPress(); }
    else if (e.key==='m'||e.key==='M'){ btn.click(); }
  });
  document.addEventListener('visibilitychange', function(){
    if (S.mode==='play') S.paused = document.hidden;
  });
  if (AUTO) setTimeout(startGame, 800);
  requestAnimationFrame(loop);
}

if (typeof document !== 'undefined' && document.getElementById) init();
})();
</script>
</body>
</html>
