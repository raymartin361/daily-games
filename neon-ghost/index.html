<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Ghost — Day 54</title>
<meta name="description" content="Neon Ghost — 60 seconds of neon maze-chase chaos. Eat every pellet, dodge three ghosts with their own hunting styles, grab power pellets to turn the tables and eat the ghosts. Pellets pay 10 x combo, ghosts pay 200 x combo, clear a wave for +500.">
<script data-goatcounter="https://raymartin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
html,body{overflow:hidden;position:fixed;width:100%;overscroll-behavior:none}
html,body{height:100%;margin:0;padding:0;background:#070512;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'Segoe UI',system-ui,sans-serif}
#c{position:fixed;inset:0;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* Neon Ghost — Day 54. A neon maze-chase game: eat pellets, dodge three
   ghosts (Blinky chases you, Pinky ambushes 4 tiles ahead, Clyde wanders
   off when close), grab a power pellet to turn the tables and eat the
   ghosts for 200 x combo. Pellets pay 10 x combo; chain 8 to raise the
   combo x1->x5. Every 20th pellet is GOLDEN (5x). Clear a wave for +500.
   Caught by a ghost costs a heart (3 hearts). Flawless (no deaths) +500. */
if (typeof document !== "undefined") {
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
}

//LOGIC-START
var GhostLogic = (function () {
  var W = 480, H = 800;
  var COLS = 15, ROWS = 15, CELL = 32, GRID_Y = 150;
  var MAX_HEARTS = 3, GAME_TIME = 60;
  var PLAYER_SPEED = 155;
  var GHOST_BASE = 100, GHOST_RAMP = 0.8, GHOST_CAP = 150;
  var FRIGHT_SPEED = 70, EYES_SPEED = 260, FRIGHT_TIME = 6;
  var PLAYER_SPAWN = { col: 7, row: 11 };
  var HOUSE = { col: 7, row: 7 };
  var DOOR = { col: 7, row: 5 };
  // '#' wall, '.' pellet, 'o' power pellet, 'H' ghost house (ghosts only).
  var MAZE = [
    "###############",
    "#o...........o#",
    "#.##.##.##.##.#",
    "#.............#",
    "#.##.##.##.##.#",
    "#....#...#....#",
    "####.#HHH#.####",
    "#....#HHH#....#",
    "####.#HHH#.####",
    "#....#...#....#",
    "#.##.##.##.##.#",
    "#.............#",
    "#.##.##.##.##.#",
    "#o...........o#",
    "###############"
  ];
  var DIRS = {
    up: { dx: 0, dy: -1 }, down: { dx: 0, dy: 1 },
    left: { dx: -1, dy: 0 }, right: { dx: 1, dy: 0 }
  };
  var DIR_NAMES = ["up", "down", "left", "right"];
  function reverseOf(dir) {
    return dir === "up" ? "down" : dir === "down" ? "up" :
      dir === "left" ? "right" : "left";
  }
  function cellAt(col, row) {
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return "#";
    return MAZE[row].charAt(col);
  }
  function isWall(col, row, forGhost) {
    var c = cellAt(col, row);
    if (c === "#") return true;
    if (c === "H") return !forGhost;
    return false;
  }
  function tileCenter(col, row) {
    return { x: col * CELL + CELL / 2, y: GRID_Y + row * CELL + CELL / 2 };
  }
  function tileFromXY(x, y) {
    return { col: Math.floor(x / CELL), row: Math.floor((y - GRID_Y) / CELL) };
  }
  function comboForStreak(streak) {
    var c = 1 + Math.floor(streak / 8);
    return c > 5 ? 5 : c;
  }
  function pelletPoints(combo, gold) { return 10 * combo * (gold ? 5 : 1); }
  function powerPoints(combo) { return 50 * combo; }
  function ghostPoints(combo) { return 200 * combo; }
  function isGoldenPellet(pelletSeq) { return pelletSeq % 20 === 19; }
  function ghostSpeedAt(elapsed) {
    var s = GHOST_BASE + GHOST_RAMP * elapsed;
    return s > GHOST_CAP ? GHOST_CAP : s;
  }
  function pelletList() {
    var list = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var ch = MAZE[r].charAt(c);
        if (ch === "." || ch === "o") list.push({ col: c, row: r, power: ch === "o" });
      }
    }
    return list;
  }
  // BFS from the player spawn over player-walkable cells. Returns a Set
  // of "col,row" keys. Every pellet must be in it or the wave can never clear.
  function bfsReachable() {
    var seen = {}, q = [PLAYER_SPAWN.col + "," + PLAYER_SPAWN.row];
    seen[q[0]] = true;
    while (q.length) {
      var parts = q.shift().split(",");
      var c = parseInt(parts[0], 10), r = parseInt(parts[1], 10);
      for (var i = 0; i < DIR_NAMES.length; i++) {
        var d = DIRS[DIR_NAMES[i]];
        var nc = c + d.dx, nr = r + d.dy;
        var key = nc + "," + nr;
        if (!seen[key] && !isWall(nc, nr, false)) { seen[key] = true; q.push(key); }
      }
    }
    return seen;
  }
  function allPelletsReachable() {
    var seen = bfsReachable();
    var list = pelletList();
    for (var i = 0; i < list.length; i++) {
      if (!seen[list[i].col + "," + list[i].row]) return false;
    }
    return true;
  }
  // Directions a ghost may take from (col,row): walkable neighbours,
  // excluding the reverse of its current dir unless it is the only way out.
  function availableDirs(col, row, dir) {
    var opts = [];
    for (var i = 0; i < DIR_NAMES.length; i++) {
      var name = DIR_NAMES[i];
      var d = DIRS[name];
      if (!isWall(col + d.dx, row + d.dy, true)) opts.push(name);
    }
    if (dir && opts.length > 1) {
      var rev = reverseOf(dir);
      var idx = opts.indexOf(rev);
      if (idx !== -1) opts.splice(idx, 1);
    }
    return opts;
  }
  // Ghost steering: frightened ghosts wander randomly; otherwise pick the
  // available direction whose destination tile is closest to the target.
  function chooseDir(col, row, dir, target, frightened, rand) {
    var opts = availableDirs(col, row, dir);
    if (!opts.length) return dir;
    if (frightened) {
      var r = (rand || Math.random)();
      return opts[Math.floor(r * opts.length) % opts.length];
    }
    var best = opts[0], bestD = Infinity;
    for (var i = 0; i < opts.length; i++) {
      var d = DIRS[opts[i]];
      var nx = col + d.dx, ny = row + d.dy;
      var dd = (nx - target.col) * (nx - target.col) + (ny - target.row) * (ny - target.row);
      if (dd < bestD) { bestD = dd; best = opts[i]; }
    }
    return best;
  }
  // Per-ghost target tile: Blinky chases, Pinky ambushes 4 tiles ahead of
  // the player, Clyde chases from far but retreats to a corner up close.
  function ghostTarget(kind, playerTile, playerDir) {
    if (kind === "blinky") return { col: playerTile.col, row: playerTile.row };
    if (kind === "pinky") {
      var d = DIRS[playerDir] || DIRS.up;
      return { col: playerTile.col + d.dx * 4, row: playerTile.row + d.dy * 4 };
    }
    var dx = playerTile.col - HOUSE.col, dy = playerTile.row - HOUSE.row;
    if (dx * dx + dy * dy > 64) return { col: playerTile.col, row: playerTile.row };
    return { col: 1, row: 13 };
  }
  function makeState() {
    return { screen: "title", score: 0, best: 0, timeLeft: GAME_TIME,
      streak: 0, pelletSeq: 0, pelletsEaten: 0, pelletsLeft: pelletList().length,
      ghostsEaten: 0, deaths: 0, hearts: MAX_HEARTS, flawless: false,
      wave: 1, frightT: 0 };
  }
  return { W: W, H: H, COLS: COLS, ROWS: ROWS, CELL: CELL, GRID_Y: GRID_Y,
    MAX_HEARTS: MAX_HEARTS, GAME_TIME: GAME_TIME, PLAYER_SPEED: PLAYER_SPEED,
    GHOST_BASE: GHOST_BASE, GHOST_RAMP: GHOST_RAMP, GHOST_CAP: GHOST_CAP,
    FRIGHT_SPEED: FRIGHT_SPEED, EYES_SPEED: EYES_SPEED, FRIGHT_TIME: FRIGHT_TIME,
    PLAYER_SPAWN: PLAYER_SPAWN, HOUSE: HOUSE, DOOR: DOOR, MAZE: MAZE,
    DIRS: DIRS, DIR_NAMES: DIR_NAMES, reverseOf: reverseOf,
    cellAt: cellAt, isWall: isWall, tileCenter: tileCenter, tileFromXY: tileFromXY,
    comboForStreak: comboForStreak, pelletPoints: pelletPoints,
    powerPoints: powerPoints, ghostPoints: ghostPoints,
    isGoldenPellet: isGoldenPellet, ghostSpeedAt: ghostSpeedAt,
    pelletList: pelletList, bfsReachable: bfsReachable,
    allPelletsReachable: allPelletsReachable, availableDirs: availableDirs,
    chooseDir: chooseDir, ghostTarget: ghostTarget, makeState: makeState };
})();
//LOGIC-END

(function () {
  var L = GhostLogic;
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var vw = 0, vh = 0, dpr = 1, scale = 1, ox = 0, oy = 0;
  function resize() {
    vw = window.innerWidth; vh = window.innerHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = vw * dpr; canvas.height = vh * dpr;
    canvas.style.width = vw + "px"; canvas.style.height = vh + "px";
    scale = Math.min(vw / L.W, vh / L.H);
    ox = (vw - L.W * scale) / 2; oy = (vh - L.H * scale) / 2;
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);
  resize();

  var AC = null, muted = false;
  try { muted = localStorage.getItem("neon_ghost_mute") === "1"; } catch (e) {}
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === "suspended") AC.resume();
    return AC;
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (muted) return;
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.15, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }
  function buzz(p) { try { if (navigator.vibrate && !muted) navigator.vibrate(p); } catch (e) {} }

  var S = L.makeState();
  try { S.best = parseInt(localStorage.getItem("neon_ghost_best") || "0", 10) || 0; } catch (e) {}
  var elapsed = 0;
  var pellets = {}; // "col,row" -> {col,row,power}
  var player = { x: 0, y: 0, dir: "left", wantDir: "left", mouth: 0 };
  var ghosts = [];
  var invulnT = 0, autoCooldown = 0, autoThinkT = 0;
  var visited = {};
  var particles = [], floats = [], bgDots = [];
  var auto = (location.search.indexOf("auto=1") !== -1);
  for (var i = 0; i < 70; i++) {
    bgDots.push({ x: Math.random() * L.W, y: Math.random() * L.H, s: 0.6 + Math.random() * 1.6, tw: Math.random() * Math.PI * 2 });
  }

  var GHOST_DEFS = [
    { kind: "blinky", color: "#ff5e7a", name: "BLINKY", blurb: "chases you", release: 0 },
    { kind: "pinky", color: "#ff8cd1", name: "PINKY", blurb: "ambushes ahead", release: 1.5 },
    { kind: "clyde", color: "#ff9d5c", name: "CLYDE", blurb: "wanders off", release: 3 }
  ];
  function refillPellets() {
    pellets = {};
    var list = L.pelletList();
    for (var i = 0; i < list.length; i++) {
      pellets[list[i].col + "," + list[i].row] = list[i];
    }
    S.pelletsLeft = list.length;
  }
  function makeGhost(def, idx) {
    var c = L.tileCenter(L.HOUSE.col - 1 + idx, L.HOUSE.row);
    return { kind: def.kind, color: def.color, name: def.name, blurb: def.blurb,
      x: c.x, y: c.y, dir: "up", state: "house", releaseT: def.release,
      decidedKey: "", frightT: 0 };
  }
  function resetPositions() {
    var sc = L.tileCenter(L.PLAYER_SPAWN.col, L.PLAYER_SPAWN.row);
    player.x = sc.x; player.y = sc.y; player.dir = "left"; player.wantDir = "left";
    ghosts = [];
    for (var i = 0; i < GHOST_DEFS.length; i++) ghosts.push(makeGhost(GHOST_DEFS[i], i));
    invulnT = 0; visited = {};
  }
  function reset() {
    S = L.makeState();
    try { S.best = parseInt(localStorage.getItem("neon_ghost_best") || "0", 10) || 0; } catch (e) {}
    elapsed = 0; particles = []; floats = []; invulnT = 0; autoCooldown = 0; autoThinkT = 0;
    refillPellets();
    resetPositions();
    window.__ghostState = S;
  }
  function start() { reset(); S.screen = "playing"; tone(660, 0.12, "sine", 0.2, 990); }
  function endGame(outOfHearts) {
    if (S.screen !== "playing") return;
    S.screen = "over";
    if (S.deaths === 0 && S.pelletsEaten > 0) { S.flawless = true; S.score += 500; }
    if (S.score > S.best) { S.best = S.score; try { localStorage.setItem("neon_ghost_best", String(S.best)); } catch (e) {} }
    tone(220, 0.4, "sawtooth", 0.15, 110);
    tone(880, 0.3, "sine", 0.12, 660);
    window.__ghostState = S;
  }
  function addFloat(x, y, text, golden) {
    floats.push({ x: x, y: y, text: text, t: 0, golden: !!golden });
  }
  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 180;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, color: color });
    }
  }
  function eatPelletAt(key) {
    var p = pellets[key];
    if (!p) return false;
    delete pellets[key];
    var combo = L.comboForStreak(S.streak);
    if (p.power) {
      var pts = L.powerPoints(combo);
      S.score += pts; S.pelletsEaten++; S.pelletsLeft--;
      S.frightT = L.FRIGHT_TIME;
      for (var i = 0; i < ghosts.length; i++) {
        var g = ghosts[i];
        if (g.state === "normal") { g.state = "frightened"; g.dir = L.reverseOf(g.dir); }
      }
      addFloat(player.x, player.y - 26, "POWER +" + pts + "!", true);
      burst(player.x, player.y, "#ffd75e", 14);
      tone(1046, 0.15, "triangle", 0.2, 1568);
      buzz(40);
      window.__ghostLastEvent = { type: "power", pts: pts };
    } else {
      var gold = L.isGoldenPellet(S.pelletSeq);
      var pts2 = L.pelletPoints(combo, gold);
      S.score += pts2; S.pelletsEaten++; S.pelletSeq++; S.streak++; S.pelletsLeft--;
      if (gold) { addFloat(player.x, player.y - 26, "+" + pts2 + " GOLDEN!", true); burst(player.x, player.y, "#ffd75e", 10); }
      tone(gold ? 880 : 520, 0.05, "sine", 0.12);
      window.__ghostLastEvent = { type: "pellet", pts: pts2, gold: gold, streak: S.streak };
    }
    window.__ghostState = S;
    if (S.pelletsLeft <= 0) {
      S.score += 500; S.wave++;
      addFloat(240, 380, "WAVE CLEAR +500!", true);
      tone(1175, 0.25, "triangle", 0.2);
      refillPellets();
      resetPositions();
    }
    return true;
  }
  function eatGhost(g) {
    var combo = L.comboForStreak(S.streak);
    var pts = L.ghostPoints(combo);
    S.score += pts; S.ghostsEaten++;
    addFloat(g.x, g.y - 26, "+" + pts + " GHOST!", true);
    burst(g.x, g.y, "#7dffce", 18);
    tone(1568, 0.12, "square", 0.16, 392);
    buzz(60);
    g.state = "eyes";
    window.__ghostLastEvent = { type: "ghost", pts: pts, ghostsEaten: S.ghostsEaten };
    window.__ghostState = S;
  }
  function die() {
    S.hearts--; S.deaths++; S.streak = 0; S.frightT = 0;
    addFloat(player.x, player.y - 26, "CAUGHT!", false);
    burst(player.x, player.y, "#ff5e7a", 22);
    tone(140, 0.3, "sawtooth", 0.2, 70);
    buzz(90);
    window.__ghostLastEvent = { type: "death", hearts: S.hearts, deaths: S.deaths };
    window.__ghostState = S;
    if (S.hearts <= 0) { endGame(true); return; }
    resetPositions();
    invulnT = 2;
  }
  // Move an entity one step in dir, snapping at tile centers and steering
  // at intersections. Returns the tile the entity now occupies.
  function stepEntity(e, dt, speed, forGhost, isPlayer) {
    var d = L.DIRS[e.dir];
    var tile = L.tileFromXY(e.x, e.y);
    var center = L.tileCenter(tile.col, tile.row);
    // Try a queued turn first when crossing the current tile's center.
    if (isPlayer && e.wantDir && e.wantDir !== e.dir) {
      var wd = L.DIRS[e.wantDir];
      var along = (center.x - e.x) * d.dx + (center.y - e.y) * d.dy;
      var cross = (center.x - e.x) * wd.dx + (center.y - e.y) * wd.dy;
      if (Math.abs(along) <= speed * dt + 1 && cross >= -1 &&
          !L.isWall(tile.col + wd.dx, tile.row + wd.dy, false)) {
        e.x = center.x; e.y = center.y; e.dir = e.wantDir;
        d = L.DIRS[e.dir];
        tile = L.tileFromXY(e.x, e.y);
        center = L.tileCenter(tile.col, tile.row);
      }
    }
    var nx = e.x + d.dx * speed * dt, ny = e.y + d.dy * speed * dt;
    var ahead = { col: tile.col + d.dx, row: tile.row + d.dy };
    if (L.isWall(ahead.col, ahead.row, forGhost)) {
      // Stop at the current tile's center.
      var stopX = center.x, stopY = center.y;
      if (d.dx > 0) nx = Math.min(nx, stopX);
      else if (d.dx < 0) nx = Math.max(nx, stopX);
      if (d.dy > 0) ny = Math.min(ny, stopY);
      else if (d.dy < 0) ny = Math.max(ny, stopY);
    }
    e.x = nx; e.y = ny;
    return L.tileFromXY(e.x, e.y);
  }
  function ghostDecide(g, tile) {
    var key = tile.col + "," + tile.row;
    if (g.decidedKey === key) return;
    var c = L.tileCenter(tile.col, tile.row);
    g.x = c.x; g.y = c.y;
    var pt = L.tileFromXY(player.x, player.y);
    var target = L.ghostTarget(g.kind, pt, player.dir);
    g.dir = L.chooseDir(tile.col, tile.row, g.dir, target, g.state === "frightened");
    g.decidedKey = key;
  }
  // Steer a ghost toward a point (house door / house center). Returns true
  // when it arrives (within 4px).
  function steerTo(g, tx, ty, dt, speed) {
    var dx = tx - g.x, dy = ty - g.y;
    var dist = Math.hypot(dx, dy);
    if (dist <= 4) { g.x = tx; g.y = ty; return true; }
    var step = Math.min(dist, speed * dt);
    g.x += dx / dist * step; g.y += dy / dist * step;
    g.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    return false;
  }
  function updateGhost(g, dt) {
    if (g.state === "house") {
      g.releaseT -= dt;
      if (g.releaseT <= 0) g.state = "leaving";
      return;
    }
    if (g.state === "leaving") {
      var dc = L.tileCenter(L.DOOR.col, L.DOOR.row);
      if (steerTo(g, dc.x, dc.y, dt, 90)) {
        g.state = "normal";
        g.decidedKey = L.DOOR.col + "," + L.DOOR.row;
        g.dir = "left";
      }
      return;
    }
    if (g.state === "eyes") {
      var dc2 = L.tileCenter(L.DOOR.col, L.DOOR.row);
      if (steerTo(g, dc2.x, dc2.y, dt, L.EYES_SPEED)) {
        g.state = "entering";
      }
      return;
    }
    if (g.state === "entering") {
      var hc = L.tileCenter(L.HOUSE.col, L.HOUSE.row);
      if (steerTo(g, hc.x, hc.y, dt, L.EYES_SPEED)) {
        g.state = "house"; g.releaseT = 0.6; g.decidedKey = "";
      }
      return;
    }
    var speed = g.state === "frightened" ? L.FRIGHT_SPEED : L.ghostSpeedAt(elapsed);
    var tile = stepEntity(g, dt, speed, true, false);
    // Decide at the tile center we just crossed.
    var center = L.tileCenter(tile.col, tile.row);
    var d = L.DIRS[g.dir];
    var along = (center.x - g.x) * d.dx + (center.y - g.y) * d.dy;
    if (along <= 0.5) ghostDecide(g, tile);
  }
  function nearestPelletTile(fromTile) {
    var best = null, bestD = Infinity;
    for (var key in pellets) {
      var p = pellets[key];
      var dd = (p.col - fromTile.col) * (p.col - fromTile.col) + (p.row - fromTile.row) * (p.row - fromTile.row);
      if (dd < bestD) { bestD = dd; best = p; }
    }
    return best;
  }
  function autoThink() {
    var tile = L.tileFromXY(player.x, player.y);
    var target = nearestPelletTile(tile);
    if (!target) return;
    var bestDir = null, bestScore = Infinity;
    for (var i = 0; i < L.DIR_NAMES.length; i++) {
      var name = L.DIR_NAMES[i];
      var d = L.DIRS[name];
      var nc = tile.col + d.dx, nr = tile.row + d.dy;
      if (L.isWall(nc, nr, false)) continue;
      if (name === L.reverseOf(player.dir) && L.availableDirs(tile.col, tile.row, player.dir).length > 1) continue;
      var dd = (nc - target.col) * (nc - target.col) + (nr - target.row) * (nr - target.row);
      var score = Math.sqrt(dd) * 10;
      for (var j = 0; j < ghosts.length; j++) {
        var g = ghosts[j];
        var gt = L.tileFromXY(g.x, g.y);
        var gd = Math.abs(gt.col - nc) + Math.abs(gt.row - nr);
        if (g.state === "frightened" && gd <= 3) score -= 160;
        else if (g.state !== "eyes" && g.state !== "house" && gd <= 2) score += 260;
        else if (g.state !== "eyes" && g.state !== "house" && gd <= 3) score += 120;
      }
      var vkey = nc + "," + nr;
      if ((visited[vkey] || 0) >= 3) score += 80;
      if (score < bestScore) { bestScore = score; bestDir = name; }
    }
    if (bestDir) player.wantDir = bestDir;
  }
  function update(dt) {
    if (S.screen !== "playing") return;
    elapsed += dt;
    S.timeLeft = Math.max(0, L.GAME_TIME - elapsed);
    if (S.timeLeft <= 0) { endGame(false); return; }
    if (S.frightT > 0) {
      S.frightT -= dt;
      if (S.frightT <= 0) {
        for (var fi = 0; fi < ghosts.length; fi++) {
          if (ghosts[fi].state === "frightened") ghosts[fi].state = "normal";
        }
      }
    }
    if (invulnT > 0) invulnT -= dt;
    if (auto) {
      autoThinkT -= dt;
      if (autoThinkT <= 0) { autoThinkT = 0.22; autoThink(); }
    }
    // Player movement.
    var ptile = stepEntity(player, dt, L.PLAYER_SPEED, false, true);
    player.mouth += dt * 10;
    var pkey = ptile.col + "," + ptile.row;
    visited[pkey] = (visited[pkey] || 0) + 1;
    // Pellet pickup when close to the tile center.
    var pc = L.tileCenter(ptile.col, ptile.row);
    if (Math.abs(player.x - pc.x) < 9 && Math.abs(player.y - pc.y) < 9) {
      eatPelletAt(pkey);
      if (S.screen !== "playing") return;
    }
    // Ghosts.
    for (var gi = 0; gi < ghosts.length; gi++) updateGhost(ghosts[gi], dt);
    // Collisions.
    for (var ci = 0; ci < ghosts.length; ci++) {
      var g = ghosts[ci];
      if (g.state === "house" || g.state === "leaving" || g.state === "entering") continue;
      var dist = Math.hypot(g.x - player.x, g.y - player.y);
      if (dist < 22) {
        if (g.state === "frightened") eatGhost(g);
        else if (g.state === "eyes") continue;
        else if (invulnT <= 0) { die(); return; }
      }
    }
    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.x += p.vx * dt; p.y += p.vy * dt; p.t += dt;
      if (p.t > 0.6) particles.splice(j, 1);
    }
    for (var k = floats.length - 1; k >= 0; k--) {
      floats[k].y -= 40 * dt; floats[k].t += dt;
      if (floats[k].t > 0.9) floats.splice(k, 1);
    }
    for (var b = 0; b < bgDots.length; b++) bgDots[b].tw += dt * 2;
  }

  function toWorld(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    var cx = (clientX - r.left) / (r.width / vw);
    var cy = (clientY - r.top) / (r.height / vh);
    return { x: (cx - ox) / scale, y: (cy - oy) / scale };
  }
  var downPos = null, downTime = 0;
  function onDown(e) {
    if (S.screen === "title" || S.screen === "over") { start(); return; }
    downPos = { x: e.clientX, y: e.clientY }; downTime = performance.now();
    e.preventDefault();
  }
  function onUp(e) {
    if (!downPos) return;
    var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    var dist = Math.hypot(dx, dy);
    var w = toWorld(e.clientX, e.clientY);
    if (dist >= 24) {
      // Swipe: steer in the swipe direction.
      if (Math.abs(dx) > Math.abs(dy)) player.wantDir = dx > 0 ? "right" : "left";
      else player.wantDir = dy > 0 ? "down" : "up";
    } else if (performance.now() - downTime < 400) {
      // Tap: steer one step toward the tap point.
      var tx = w.x - player.x, ty = w.y - player.y;
      if (Math.abs(tx) > Math.abs(ty)) player.wantDir = tx > 0 ? "right" : "left";
      else if (Math.abs(ty) > 8) player.wantDir = ty > 0 ? "down" : "up";
    }
    downPos = null;
    e.preventDefault();
  }
  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", function () { downPos = null; });
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") player.wantDir = "up";
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") player.wantDir = "down";
    else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") player.wantDir = "left";
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") player.wantDir = "right";
    else if (e.key === "Enter" && (S.screen === "title" || S.screen === "over")) start();
    else if (e.key === "m" || e.key === "M") { muted = !muted; try { localStorage.setItem("neon_ghost_mute", muted ? "1" : "0"); } catch (err) {} }
  });

  function drawGhostShape(x, y, color, frightened, eyesOnly, dir, t) {
    ctx.save();
    ctx.translate(x, y);
    if (!eyesOnly) {
      ctx.fillStyle = frightened ? "#2a4bff" : color;
      ctx.strokeStyle = frightened ? "#7d9bff" : color;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = frightened ? "#2a4bff" : color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(-12, 10);
      ctx.lineTo(-12, -2);
      ctx.arc(0, -2, 12, Math.PI, 0);
      ctx.lineTo(12, 10);
      // Wavy skirt.
      var wob = Math.sin(t * 6) * 2;
      ctx.lineTo(6, 6 + wob);
      ctx.lineTo(3, 10);
      ctx.lineTo(0, 6 + wob);
      ctx.lineTo(-3, 10);
      ctx.lineTo(-6, 6 + wob);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    if (frightened) {
      // Scared face: two dots + zigzag mouth.
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(-4, -4, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -4, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-7, 4); ctx.lineTo(-4, 7); ctx.lineTo(-1, 4); ctx.lineTo(2, 7); ctx.lineTo(5, 4); ctx.lineTo(7, 7);
      ctx.stroke();
    } else {
      // Eyes look in the direction of travel.
      var ex = 0, ey = 0;
      if (dir === "left") ex = -2; else if (dir === "right") ex = 2;
      else if (dir === "up") ey = -2; else if (dir === "down") ey = 2;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.ellipse(-4.5, -4, 3.4, 4.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(4.5, -4, 3.4, 4.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#16224d";
      ctx.beginPath(); ctx.arc(-4.5 + ex, -4 + ey, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4.5 + ex, -4 + ey, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  function drawPlayer(x, y, dir, t) {
    var ang = 0;
    if (dir === "right") ang = 0;
    else if (dir === "down") ang = Math.PI / 2;
    else if (dir === "left") ang = Math.PI;
    else if (dir === "up") ang = -Math.PI / 2;
    var mouth = 0.25 + 0.2 * Math.abs(Math.sin(t));
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.fillStyle = "#ffe94a";
    ctx.shadowColor = "#ffe94a"; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, 13, mouth, Math.PI * 2 - mouth);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  function drawHUD() {
    ctx.fillStyle = "rgba(7,5,18,0.88)";
    ctx.fillRect(0, 0, L.W, 54);
    ctx.fillStyle = "#e8ecff"; ctx.font = "bold 20px 'Segoe UI',system-ui,sans-serif";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText("SCORE " + S.score, 14, 18);
    ctx.fillText("BEST " + S.best, 14, 42);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd75e";
    ctx.fillText("TIME " + Math.ceil(S.timeLeft) + "s", 240, 18);
    var combo = L.comboForStreak(S.streak);
    ctx.fillStyle = combo >= 3 ? "#ff8cd1" : "#aab4e8";
    ctx.fillText("COMBO x" + combo + (S.streak > 0 ? " (" + S.streak + ")" : ""), 240, 42);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ff5e7a";
    var hearts = "";
    for (var i = 0; i < L.MAX_HEARTS; i++) hearts += i < S.hearts ? "♥" : "♡";
    ctx.fillText(hearts, 466, 18);
    ctx.fillStyle = "#6cf0ff";
    ctx.fillText("WAVE " + S.wave, 466, 42);
    if (S.frightT <= 0) {
      ctx.fillStyle = "#6cf0ff";
      ctx.font = "14px 'Segoe UI',system-ui,sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("PELLETS " + S.pelletsLeft + " LEFT", 240, 112);
    }
    if (S.frightT > 0) {
      ctx.fillStyle = "#2a4bff";
      ctx.fillRect(14, 58, (L.W - 28) * (S.frightT / L.FRIGHT_TIME), 5);
      ctx.fillStyle = "#7d9bff";
      ctx.font = "bold 12px 'Segoe UI',system-ui,sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("POWER MODE — EAT THE GHOSTS!", 240, 76);
    }
  }
  function drawLegend() {
    ctx.fillStyle = "rgba(7,5,18,0.88)";
    ctx.fillRect(0, 648, L.W, 152);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "bold 15px 'Segoe UI',system-ui,sans-serif";
    ctx.fillStyle = "#aab4e8";
    ctx.fillText("KNOW YOUR GHOSTS", 16, 668);
    for (var i = 0; i < GHOST_DEFS.length; i++) {
      var def = GHOST_DEFS[i];
      var gy = 700 + i * 26;
      drawGhostShape(34, gy, def.color, false, false, "left", performance.now() / 1000);
      ctx.fillStyle = def.color;
      ctx.font = "bold 15px 'Segoe UI',system-ui,sans-serif";
      ctx.fillText(def.name, 56, gy);
      ctx.fillStyle = "#aab4e8";
      ctx.font = "14px 'Segoe UI',system-ui,sans-serif";
      ctx.fillText("— " + def.blurb, 130, gy);
    }
    ctx.fillStyle = "#ffd75e";
    ctx.font = "bold 14px 'Segoe UI',system-ui,sans-serif";
    ctx.fillText("POWER PELLETS turn the tables — ghosts pay 200 x combo!", 16, 784);
  }
  function drawMaze() {
    // Corridor floor.
    ctx.fillStyle = "#0a0f24";
    ctx.fillRect(0, L.GRID_Y, L.W, L.ROWS * L.CELL);
    // Walls as neon blocks.
    for (var r = 0; r < L.ROWS; r++) {
      for (var c = 0; c < L.COLS; c++) {
        if (L.cellAt(c, r) === "#") {
          ctx.fillStyle = "#16224d";
          ctx.strokeStyle = "#3a5bff";
          ctx.lineWidth = 1.5;
          ctx.shadowColor = "#3a5bff"; ctx.shadowBlur = 5;
          ctx.beginPath();
          ctx.roundRect(c * L.CELL + 1, L.GRID_Y + r * L.CELL + 1, L.CELL - 2, L.CELL - 2, 5);
          ctx.fill(); ctx.stroke();
          ctx.shadowBlur = 0;
        }
      }
    }
    // Ghost-house door.
    var dc = L.tileCenter(L.DOOR.col, L.DOOR.row);
    ctx.fillStyle = "#ff8cd1";
    ctx.shadowColor = "#ff8cd1"; ctx.shadowBlur = 8;
    ctx.fillRect(dc.x - 16, dc.y + L.CELL / 2 - 2, 32, 4);
    ctx.shadowBlur = 0;
    // Pellets.
    var t = performance.now() / 1000;
    for (var key in pellets) {
      var p = pellets[key];
      var pc = L.tileCenter(p.col, p.row);
      if (p.power) {
        var pulse = 0.75 + 0.25 * Math.sin(t * 5);
        ctx.fillStyle = "#ffd75e";
        ctx.shadowColor = "#ffd75e"; ctx.shadowBlur = 12;
        ctx.globalAlpha = pulse;
        ctx.beginPath(); ctx.arc(pc.x, pc.y, 7, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      } else {
        // Golden pellets are announced when eaten (every 20th pellet);
        // which tile that will be depends on the route, so all dots render alike.
        ctx.fillStyle = "#cfe8ff";
        ctx.shadowColor = "#cfe8ff"; ctx.shadowBlur = 3;
        ctx.beginPath(); ctx.arc(pc.x, pc.y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }
  function drawTitle() {
    ctx.fillStyle = "rgba(7,5,18,0.78)";
    ctx.fillRect(0, 0, L.W, L.H);
    ctx.fillStyle = "#e8ecff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "bold 52px 'Segoe UI',system-ui,sans-serif";
    ctx.shadowColor = "#ffe94a"; ctx.shadowBlur = 18;
    ctx.fillText("NEON", 240, 180);
    ctx.fillText("GHOST", 240, 240);
    ctx.shadowBlur = 0;
    ctx.font = "16px 'Segoe UI',system-ui,sans-serif";
    ctx.fillStyle = "#aab4e8";
    ctx.fillText("60 seconds of neon maze-chase chaos!", 240, 298);
    ctx.fillText("SWIPE or use ARROWS to steer — eat every pellet,", 240, 326);
    ctx.fillText("dodge the ghosts, grab power pellets to eat THEM.", 240, 354);
    ctx.fillText("Pellets pay 10 x combo — chain 8 to raise it to x5.", 240, 382);
    ctx.fillText("Ghosts pay 200 x combo. Clear a wave for +500!", 240, 410);
    ctx.fillStyle = "#ffd75e"; ctx.font = "bold 20px 'Segoe UI',system-ui,sans-serif";
    ctx.fillText(S.best > 0 ? "BEST " + S.best + " — TAP TO PLAY" : "TAP TO PLAY", 240, 468);
    ctx.fillStyle = "#7780b8"; ctx.font = "14px 'Segoe UI',system-ui,sans-serif";
    ctx.fillText("Arrows / WASD steer · M mute · Day 54", 240, 508);
    drawPlayer(240, 600, "right", performance.now() / 1000);
    drawGhostShape(180, 600, "#ff5e7a", false, false, "left", performance.now() / 1000);
    drawGhostShape(300, 600, "#ff8cd1", false, false, "left", performance.now() / 1000);
  }
  function drawOver() {
    ctx.fillStyle = "rgba(7,5,18,0.72)";
    ctx.fillRect(0, 0, L.W, L.H);
    ctx.fillStyle = "#e8ecff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "bold 44px 'Segoe UI',system-ui,sans-serif";
    ctx.shadowColor = "#ff8cd1"; ctx.shadowBlur = 16;
    ctx.fillText(S.hearts <= 0 ? "GAME OVER!" : "TIME'S UP!", 240, 260);
    ctx.shadowBlur = 0;
    ctx.font = "bold 30px 'Segoe UI',system-ui,sans-serif";
    ctx.fillStyle = "#ffd75e";
    ctx.fillText("SCORE " + S.score, 240, 330);
    ctx.font = "20px 'Segoe UI',system-ui,sans-serif";
    ctx.fillStyle = "#aab4e8";
    ctx.fillText("Pellets " + S.pelletsEaten + " · Ghosts " + S.ghostsEaten + " · Waves " + (S.wave - 1) + " · Deaths " + S.deaths, 240, 372);
    if (S.flawless) { ctx.fillStyle = "#2ee6a8"; ctx.fillText("FLAWLESS +500 — never caught once!", 240, 404); }
    ctx.fillStyle = "#e8ecff";
    ctx.fillText("BEST " + S.best, 240, 436);
    ctx.fillStyle = "#ffd75e"; ctx.font = "bold 20px 'Segoe UI',system-ui,sans-serif";
    ctx.fillText("TAP TO PLAY AGAIN", 240, 500);
  }
  function render() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
    var bg = ctx.createLinearGradient(0, 0, 0, L.H);
    bg.addColorStop(0, "#04122b");
    bg.addColorStop(0.5, "#0b1030");
    bg.addColorStop(1, "#120a2e");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, L.W, L.H);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, L.W, L.H); ctx.clip();
    for (var i = 0; i < bgDots.length; i++) {
      var bd = bgDots[i];
      ctx.globalAlpha = 0.3 + 0.4 * Math.abs(Math.sin(bd.tw));
      ctx.fillStyle = "#cdd6ff";
      ctx.beginPath(); ctx.arc(bd.x, bd.y, bd.s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawMaze();
    var t = performance.now() / 1000;
    // Ghosts.
    for (var gi = 0; gi < ghosts.length; gi++) {
      var g = ghosts[gi];
      if (g.state === "house") {
        // Bob inside the house.
        var bob = Math.sin(t * 4 + gi * 2) * 3;
        drawGhostShape(g.x, g.y + bob, g.color, false, false, g.dir, t);
      } else if (g.state === "eyes") {
        drawGhostShape(g.x, g.y, g.color, false, true, g.dir, t);
      } else {
        drawGhostShape(g.x, g.y, g.color, g.state === "frightened", false, g.dir, t);
      }
    }
    // Player (blinks while invulnerable).
    if (S.screen === "playing" || S.screen === "over") {
      if (!(invulnT > 0 && Math.floor(t * 8) % 2 === 0)) {
        drawPlayer(player.x, player.y, player.dir, t);
      }
    }
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      ctx.globalAlpha = Math.max(0, 1 - p.t / 0.6);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (var k = 0; k < floats.length; k++) {
      var f = floats[k];
      ctx.globalAlpha = Math.max(0, 1 - f.t / 0.9);
      ctx.fillStyle = f.golden ? "#ffd75e" : "#e8ecff";
      ctx.font = "bold 22px 'Segoe UI',system-ui,sans-serif";
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    drawLegend();
    ctx.restore();
    if (S.screen === "title") drawTitle();
    else if (S.screen === "over") drawOver();
    if (S.screen === "playing" || S.screen === "over") drawHUD();
  }

  window.__ghostState = S;
  window.__ghostDebug = {
    player: function () { var t = L.tileFromXY(player.x, player.y); return { x: Math.round(player.x), y: Math.round(player.y), col: t.col, row: t.row, dir: player.dir, wantDir: player.wantDir }; },
    ghosts: function () { return ghosts.map(function (g) { var t = L.tileFromXY(g.x, g.y); return { kind: g.kind, state: g.state, col: t.col, row: t.row, dir: g.dir }; }); },
    setAuto: function (v) { auto = v; },
    start: function () { start(); },
    steer: function (dir) { player.wantDir = dir; },
    // Teleport the player onto the nearest uneaten pellet: the next
    // physics step must eat exactly one pellet.
    debugPellet: function () {
      if (S.screen !== "playing") return null;
      var tile = L.tileFromXY(player.x, player.y);
      var best = null, bestD = Infinity;
      for (var key in pellets) {
        var p = pellets[key];
        if (p.power) continue;
        var dd = (p.col - tile.col) * (p.col - tile.col) + (p.row - tile.row) * (p.row - tile.row);
        if (dd < bestD) { bestD = dd; best = p; }
      }
      if (!best) return null;
      var c = L.tileCenter(best.col, best.row);
      player.x = c.x; player.y = c.y;
      return { col: best.col, row: best.row };
    },
    // Teleport the player onto a power pellet: next step must trigger fright.
    debugPower: function () {
      if (S.screen !== "playing") return null;
      for (var key in pellets) {
        var p = pellets[key];
        if (!p.power) continue;
        var c = L.tileCenter(p.col, p.row);
        player.x = c.x; player.y = c.y;
        return { col: p.col, row: p.row };
      }
      return null;
    },
    // Force fright mode, then drop the nearest ghost onto the player:
    // the next step must eat it for 200 x combo.
    debugGhost: function () {
      if (S.screen !== "playing") return null;
      S.frightT = L.FRIGHT_TIME;
      var target = null;
      for (var i = 0; i < ghosts.length; i++) {
        var g = ghosts[i];
        if (g.state === "normal" || g.state === "leaving") { g.state = "frightened"; target = g; break; }
      }
      if (!target) return null;
      target.x = player.x; target.y = player.y;
      return { kind: target.kind };
    },
    // Drop the nearest hunting ghost onto the player with no fright and no
    // invulnerability: the next step must cost exactly one heart.
    debugCaught: function () {
      if (S.screen !== "playing") return null;
      S.frightT = 0; invulnT = 0;
      for (var i = 0; i < ghosts.length; i++) {
        var g = ghosts[i];
        if (g.state === "normal" || g.state === "frightened") {
          g.state = "normal";
          g.x = player.x; g.y = player.y;
          return { kind: g.kind };
        }
      }
      return null;
    }
  };

  refillPellets();
  resetPositions();
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (auto) start();
})();
</script>
</body>
</html>
